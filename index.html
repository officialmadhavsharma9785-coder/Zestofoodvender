window.addEventListener('error',function(e){
  function show(){
    var box=document.createElement('div');
    box.style.cssText='position:fixed;inset:0;z-index:999999;background:#1a1a1a;color:#fff;padding:20px;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap';
    box.textContent='JS ERROR CAUGHT:\n\n'+(e.message||'')+'\n\nFile: '+(e.filename||'')+'\nLine: '+(e.lineno||'')+':'+(e.colno||'')+'\n\n'+(e.error&&e.error.stack||'');
    (document.body||document.documentElement).appendChild(box);
  }
  if(document.body)show();else document.addEventListener('DOMContentLoaded',show);
});
</script>

<style>
:root{

*{box-sizing:border-box}
*{min-width:0}
body,h1,h2,h3,h4,h5,h6,p,span,div,a,button,input,select,textarea,td,th,label{overflow-wrap:break-word;word-break:normal}

button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
#app{min-height:100dvh;display:flex;flex-direction:column}
.wrap{max-width:var(--container);margin:0 auto}

.del-status-chip.preparing{background:#FEF3C7;color:#B45309;border:1px solid #FDE68A}
.del-status-chip.ready{background:#EDE9FE;color:#6D28D9;border:1px solid #DDD6FE}
.del-status-chip.picked{background:#F3E8FF;color:#7C3AED;border:1px solid #DDD6FE}
.del-status-chip.ontheway{background:#DBEAFE;color:#1D4ED8;border:1px solid #BFDBFE}
.del-status-chip.delivered{background:#E6F7EE;color:#18A957;border:1px solid #CFF7DF}
.slide-track{position:relative;height:58px;border-radius:999px;overflow:hidden;user-select:none;touch-action:none}
.slide-track .slide-fill{position:absolute;inset:0;width:0;transition:width .05s linear}
.slide-track .slide-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;letter-spacing:.3px;pointer-events:none;z-index:1}
.slide-track .slide-handle{position:absolute;top:4px;left:4px;width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:grab;z-index:2;transition:left .05s linear}
.new-order-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:none;align-items:flex-end;justify-content:center}
.new-order-modal-backdrop.open{display:flex}
.new-order-modal{background:#fff;border-radius:22px 22px 0 0;max-width:var(--container);width:100%;max-height:88vh;overflow-y:auto;animation:authPopIn .35s cubic-bezier(.16,1,.3,1);padding-bottom:calc(20px + var(--safe))}
@media(min-width:760px){.new-order-modal-backdrop{align-items:center}.new-order-modal{border-radius:22px;margin:20px}}
@keyframes ringPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ring-pulse{animation:ringPulse 1s ease-in-out infinite}

/* Apple Glass (glassmorphism) popup */
.glass-backdrop{position:fixed;inset:0;background:rgba(10,20,15,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s ease}
.glass-backdrop.show{opacity:1}
.glass-card{background:rgba(255,255,255,.55);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.6);border-radius:26px;box-shadow:0 20px 60px rgba(13,58,51,.35),0 2px 8px rgba(0,0,0,.1);max-width:360px;width:100%;padding:26px 22px;text-align:center;transform:scale(.9);opacity:0;transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s ease}
.glass-backdrop.show .glass-card{transform:scale(1);opacity:1}
.glass-icon{width:64px;height:64px;border-radius:50%;background:rgba(20,90,50,.12);border:1px solid rgba(20,90,50,.2);display:grid;place-items:center;margin:0 auto 14px;font-size:28px;color:var(--accentDark)}
.glass-stat-row{display:flex;gap:10px;margin-top:16px}
.glass-stat{flex:1;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);border-radius:16px;padding:12px 8px}
.glass-stat .num{font-weight:800;font-size:18px;color:var(--accentDark);font-family:Poppins}
.glass-stat .lbl{font-size:11px;color:#3a4a44;margin-top:2px}

/* Reward unlock confetti animation */
.confetti-piece{position:absolute;top:-10px;width:8px;height:14px;opacity:0;animation:confettiFall 2.2s ease-in forwards}
@keyframes confettiFall{
  0%{opacity:1;transform:translateY(0) rotate(0deg)}
  100%{opacity:0;transform:translateY(420px) rotate(540deg)}
}
@keyframes rewardPopIn{
  0%{transform:scale(.6) translateY(20px);opacity:0}
  60%{transform:scale(1.05) translateY(0);opacity:1}
  100%{transform:scale(1) translateY(0);opacity:1}
}
.reward-unlock-card{animation:rewardPopIn .5s cubic-bezier(.16,1,.3,1)}

/* ===== Premium Loyalty Card ===== */
@keyframes loyaltyCardIn{0%{opacity:0;transform:translateY(14px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes loyaltyShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes loyaltyFillIn{0%{width:0}}
.loyalty-card-premium{position:relative;margin:0 14px 14px;border-radius:20px;overflow:hidden;color:#fff;cursor:pointer;animation:loyaltyCardIn .5s cubic-bezier(.16,1,.3,1);box-shadow:0 10px 30px rgba(13,58,51,.25);transition:transform .2s ease}
.loyalty-card-premium:active{transform:scale(.98)}
.loyalty-card-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.loyalty-card-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(13,58,51,.88),rgba(20,90,50,.72));z-index:1}
.loyalty-card-content{position:relative;z-index:2;padding:16px}
.loyalty-card-shine{position:absolute;inset:0;z-index:1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.16) 45%,transparent 60%);background-size:250% 100%;animation:loyaltyShimmer 3.2s ease-in-out infinite}
.loyalty-reward-thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);flex-shrink:0}
.loyalty-progress-track{margin-top:10px;background:rgba(255,255,255,.25);border-radius:999px;height:9px;overflow:hidden}
.loyalty-progress-fill{height:100%;background:linear-gradient(90deg,#fff,#d4e8dc);border-radius:999px;transition:width .8s cubic-bezier(.16,1,.3,1);animation:loyaltyFillIn .8s cubic-bezier(.16,1,.3,1)}
.loyalty-view-all-btn{font-weight:700;font-size:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;white-space:nowrap;transition:background .2s ease}
.loyalty-view-all-btn:hover{background:rgba(255,255,255,.3)}

/* ===== Reward details popup ===== */
.reward-popup-card{max-width:380px}
.reward-popup-image{width:100%;height:140px;object-fit:cover;border-radius:16px;margin-bottom:14px;border:1px solid rgba(255,255,255,.6)}
.reward-popup-code{font-family:monospace;font-weight:800;letter-spacing:1px;background:rgba(20,90,50,.1);border:1px dashed rgba(20,90,50,.35);border-radius:12px;padding:10px;margin:10px 0;font-size:16px;color:var(--accentDark)}

/* ===== In Progress milestone card ===== */
.milestone-progress-card{position:relative;border-radius:18px;overflow:hidden;margin-bottom:12px;background:linear-gradient(135deg,#fff,#f4faf6);border:1px solid var(--line);box-shadow:var(--shadow-sm);animation:loyaltyCardIn .4s cubic-bezier(.16,1,.3,1)}
.milestone-progress-inner{display:flex;gap:12px;padding:14px;align-items:center}
.milestone-progress-track{margin-top:8px;background:var(--accentLight);border-radius:999px;height:8px;overflow:hidden}
.milestone-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accentDark));border-radius:999px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.reward-status-card{transition:transform .2s ease,box-shadow .2s ease;animation:loyaltyCardIn .4s cubic-bezier(.16,1,.3,1)}
.reward-status-card:active{transform:scale(.98)}
.del-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.del-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.del-stat .num{font-size:24px;font-weight:700;font-family:Poppins;color:var(--accent)}
.del-stat .lbl{font-size:11px;color:var(--muted);margin-top:2px}

/* City Modal Overlay */
#city-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);
  z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;
}
.city-modal-box{background:#fff;width:100%;max-width:400px;border-radius:24px;padding:24px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
.city-option{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer;transition:all 0.2s;font-weight:600;}
.city-option:hover{border-color:var(--accent);background:var(--accentLight);}

/* Delivery Dashboard Earning Boxes */
.earning-box{background:var(--accentLight);border:1px solid var(--accent);border-radius:10px;padding:12px;text-align:center;}
.earning-box .amt{font-size:22px;font-weight:bold;color:var(--accentDark);font-family:Poppins}
.earning-box .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}

/* Store Lock Banner */
.lock-banner{background:#FEE2E2; color:#E11D48; padding:12px; text-align:center; font-weight:bold; border-bottom:1px solid #FECACA;}
</style>

<script>
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const money=n=>'\u20B9'+(n||0).toLocaleString("en-IN");
const uid=()=>'p_'+Math.random().toString(36).slice(2)+Date.now().toString(36);
const readLocal=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};
const writeLocal=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const escapeHtml=(s="")=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

/* ===== Avatar ===== */
function avatarHtml(size,onColor){
  size=size||34;
  const initial=((PROFILE.name||AUTH_USER?.email||"U").trim().charAt(0)||"U").toUpperCase();
  if(PROFILE.avatar){
    return `<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;flex-shrink:0;${onColor?'border:2px solid rgba(255,255,255,.5)':'border:2px solid var(--line)'}"><img src="${PROFILE.avatar}" style="width:100%;height:100%;object-fit:cover"></div>`;
  }
  const bg=onColor?'rgba(255,255,255,.25)':'var(--accent)';
  const border=onColor?'2px solid rgba(255,255,255,.5)':'2px solid var(--accentDark)';
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${Math.round(size*0.42)}px;flex-shrink:0;border:${border}">${escapeHtml(initial)}</div>`;
}
function updateTopbarAvatar(){
  const el=document.getElementById('menu-toggle-btn');
  if(el)el.innerHTML=avatarHtml(32,false);
}

/* ===== Zomato-style Live Location System ===== */
let USER_LIVE_LOCATION=readLocal("sf_live_location",null);
function updateHeaderLocationLabel(){
  const el=document.getElementById('home-location-label');
  if(el)el.innerHTML=`<i class="fa-solid fa-location-dot"></i> ${escapeHtml(USER_LIVE_LOCATION?USER_LIVE_LOCATION.label:USER_CITY)}`;
}
function reverseGeocode(lat,lng){
  return fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16`)
    .then(r=>r.json())
    .then(d=>{
      const a=d.address||{};
      return a.suburb||a.neighbourhood||a.village||a.town||a.city_district||a.city||(d.display_name?d.display_name.split(',')[0]:"Current Location");
    }).catch(()=>"Current Location");
}
function fetchLiveLocation(showPopupOnFail){
  if(!navigator.geolocation){if(showPopupOnFail)alert("Geolocation is not supported on this device.");return}
  navigator.geolocation.getCurrentPosition(pos=>{
    const{latitude,longitude}=pos.coords;
    writeLocal("sf_loc_popup_shown",false); // permission is granted — reset so a future revoke can prompt again
    reverseGeocode(latitude,longitude).then(label=>{
      USER_LIVE_LOCATION={lat:latitude,lng:longitude,label,updatedAt:Date.now()};
      writeLocal("sf_live_location",USER_LIVE_LOCATION);
      updateHeaderLocationLabel();
      toast("Location updated!");
    });
  },err=>{
    console.warn("Location error:",err);
    const alreadyShown=readLocal("sf_loc_popup_shown",false);
    if(showPopupOnFail||!alreadyShown){writeLocal("sf_loc_popup_shown",true);showLocationPermissionPopup()}
  },{enableHighAccuracy:true,maximumAge:60000,timeout:15000});
}
function showLocationPermissionPopup(){
  if(document.getElementById("loc-permission-modal"))return;
  const div=document.createElement("div");
  div.id="loc-permission-modal";
  div.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9997;display:flex;align-items:center;justify-content:center;padding:20px";
  div.innerHTML=`<div class="card pad" style="max-width:340px;text-align:center">
    <div style="width:60px;height:60px;background:var(--accentLight);border-radius:50%;display:grid;place-items:center;margin:0 auto 12px"><i class="fa-solid fa-location-crosshairs" style="font-size:26px;color:var(--accent)"></i></div>
    <h3 style="margin:0 0 8px;font-family:Poppins;color:var(--accentDark)">Enable Location</h3>
    <p class="muted" style="font-size:13px;margin:0 0 16px">Turn on location access for accurate delivery and a faster checkout experience.</p>
    <button class="btn btn-block" id="loc-modal-enable">Enable Location</button>
    <button class="btn btn-outline btn-block" style="margin-top:8px" id="loc-modal-dismiss">Not Now</button>
  </div>`;
  document.body.appendChild(div);
  $("#loc-modal-enable").addEventListener("click",()=>{fetchLiveLocation(true);div.remove()});
  $("#loc-modal-dismiss").addEventListener("click",()=>div.remove());
}
const toast=msg=>{const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400)};
const routeTo=hash=>{location.hash=hash};

let PROFILE=readLocal("sf_profile",{name:"",email:"",phone:"",address:"",pincode:"",city:"",state:"",district:"",landmark:"",avatar:"",isComplete:false,favorites:[]});
const saveProfile=()=>writeLocal("sf_profile",PROFILE);
const hasCompleteProfile=()=>!!(PROFILE.name&&PROFILE.email&&PROFILE.phone&&PROFILE.address&&PROFILE.pincode);

let PRODUCTS=[];
let CATEGORIES=[];
let OFFERS=[];
let AUTH_USER=null;
let SELECTED_REWARD_ID=null;
let SELECTED_OFFER=null;
let MY_LOYALTY_RESET_AT=0;
let authListenerInitialized=false;
let authBootHandled=false;
function refreshPrivateListeners(){
  const a=getAuth();
  if(!a||!a.currentUser)return;
  try{ordersRef.off('value');ratingsRef.off('value');offerRedemptionsRef.off('value');referralCampaignsRef.off('value');referralsRef.off('value');referralSettingsRef.off('value');rewardsRef.off('value');milestonesRef.off('value');loyaltyCardSettingsRef.off('value');}catch(e){}
  ordersRef.orderByChild('vendorUid').equalTo(a.currentUser.uid).on('value',snap=>{ORDERS=snap.val()?Object.values(snap.val()):[];ORDERS.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));dataFetched.orders=true;checkAndRender();checkAndAwardLoyalty();manageLiveTracking();checkReferralProgress()},err=>{console.warn('vendor orders read failed:',err);ORDERS=[];dataFetched.orders=true;checkAndRender()});
  // Orders are loaded only after vendor auth, using vendorUid query.
  ratingsRef.on('value',snap=>{RATINGS=snap.val()?Object.values(snap.val()):[];dataFetched.ratings=true;checkAndRender()},err=>{console.warn('ratings read failed:',err);RATINGS=[];dataFetched.ratings=true;checkAndRender()});
  try{deliveryAppsRef.off('value');vendorsRef.off('value');vendorPlansRef.off('value');vendorHelpVideosRef.off('value');vendorSettingsRef.off('value');}catch(e){}
  // Delivery applications are admin-only; vendor panel does not subscribe to them.
  if(a.currentUser){
    vendorsRef.child(a.currentUser.uid).on('value',snap=>{
      const v=snap.val();
      VENDORS_ALL=v?[{uid:a.currentUser.uid,...v}]:[];
      if(!v){
        console.warn('vendor profile is empty or null - vendor record does not exist');
      }
      checkVendorRedirect();
    },err=>{
      console.error('vendor profile read failed:',err.code,err.message);
      VENDORS_ALL=[];
      checkVendorRedirect();
    });
  }
  vendorPlansRef.on('value',snap=>{
    const v=snap.val();
    VENDOR_PLANS=v?Object.keys(v).map(k=>({id:k,...v[k]})).filter(p=>p.active!==false):[];
  },err=>{
    console.warn('vendor plans read failed:',err.code);
    VENDOR_PLANS=[];
  });
  vendorHelpVideosRef.on('value',snap=>{
    const v=snap.val();
    VENDOR_HELP_VIDEOS=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];
  },err=>{
    console.warn('vendor help videos read failed:',err.code);
    VENDOR_HELP_VIDEOS=[];
  });
  vendorSettingsRef.on('value',snap=>{
    VENDOR_SETTINGS=snap.val()||{maxPrepMinutes:120};
  },err=>{
    console.warn('vendor settings read failed:',err.code);
    VENDOR_SETTINGS={maxPrepMinutes:120};
  });
}
function initAuthListenerOnce(){
  if(authListenerInitialized)return;
  authListenerInitialized=true;
  enableAuthPersistence();
  const a=getAuth();
  if(!a){authBootHandled=true;return;}
  try{
    a.onAuthStateChanged(user=>{
      AUTH_USER=user;
      authBootHandled=true;
      if(user){
        refreshPrivateListeners();

function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function estimateEtaMinutes(km){return Math.max(1,Math.round((km/25)*60))}

let _trackWatchId=null,_trackOrderKey=null,_lastTrackWrite=0;
function startLiveTracking(orderKey){
  if(_trackWatchId!==null&&_trackOrderKey===orderKey)return;
  stopLiveTracking();
  if(!navigator.geolocation){notifyOnce('gps-unsupported','Location Unavailable','Your device/browser does not support GPS tracking, so customers won\'t see your live location.');return}
  _trackOrderKey=orderKey;
  _trackWatchId=navigator.geolocation.watchPosition(pos=>{
    const now=Date.now();
    if(now-_lastTrackWrite<10000)return; // throttle writes ~every 10s — battery & bandwidth efficient
    _lastTrackWrite=now;
    const{latitude,longitude}=pos.coords;
    db.ref('orders/'+orderKey+'/liveLocation').set({lat:latitude,lng:longitude,updatedAt:now}).catch(()=>{});
    db.ref('orders/'+orderKey+'/trackingPath/'+now).set({lat:latitude,lng:longitude,ts:now}).catch(()=>{});
  },err=>{
    console.warn("GPS watch error:",err);
    notifyOnce('gps-error-'+orderKey,'Location Permission Needed','Please enable location access so customers can see your live delivery location.');
    stopLiveTracking(); // clear state so the next data update retries instead of assuming tracking already succeeded
  },{enableHighAccuracy:true,maximumAge:8000,timeout:20000});
}
function stopLiveTracking(){
  if(_trackWatchId!==null){navigator.geolocation.clearWatch(_trackWatchId);_trackWatchId=null;_trackOrderKey=null}
}

let _ringCtx=null,_ringInterval=null;
function startRingtone(){
  if(_ringInterval)return;
  try{
    _ringCtx=_ringCtx||new (window.AudioContext||window.webkitAudioContext)();
    const beep=()=>{
      if(!_ringCtx)return;
      const o1=_ringCtx.createOscillator(),g1=_ringCtx.createGain();
      o1.type="sine";o1.frequency.value=880;
      g1.gain.setValueAtTime(0,_ringCtx.currentTime);
      g1.gain.linearRampToValueAtTime(.25,_ringCtx.currentTime+.02);
      g1.gain.linearRampToValueAtTime(0,_ringCtx.currentTime+.35);
      o1.connect(g1);g1.connect(_ringCtx.destination);
      o1.start();o1.stop(_ringCtx.currentTime+.4);
    };
    beep();
    _ringInterval=setInterval(beep,700);
  }catch(e){console.warn("Ringtone unavailable:",e)}
}
function stopRingtone(){
  if(_ringInterval){clearInterval(_ringInterval);_ringInterval=null}
}

let _activeSlide=null;
function _slideMove(clientX){
  if(!_activeSlide||_activeSlide.done)return;
  const{track,handle,fill}=_activeSlide;
  const max=track.offsetWidth-58;
  let x=clientX-_activeSlide.startX;
  x=Math.max(0,Math.min(max,x));
  handle.style.left=(4+x)+"px";
  fill.style.width=(x+58)+"px";
  if(x>=max-2){_activeSlide.done=true;handle.classList.remove("ring-pulse");const cb=_activeSlide.onComplete;_activeSlide=null;cb()}
}
function _slideEnd(){
  if(!_activeSlide)return;
  if(!_activeSlide.done){_activeSlide.handle.style.left="4px";_activeSlide.fill.style.width="0px";_activeSlide.handle.style.cursor="grab"}
  _activeSlide=null;
}
window.addEventListener("mousemove",e=>_slideMove(e.clientX));
window.addEventListener("touchmove",e=>{if(e.touches&&e.touches[0])_slideMove(e.touches[0].clientX)},{passive:true});
window.addEventListener("mouseup",_slideEnd);

function initSlideAction(trackId,onComplete){

    _activeSlide={track,handle,fill,onComplete,startX:clientX-(handle.offsetLeft-4),done:false};
    handle.style.cursor="grabbing";
  };
  handle.addEventListener("mousedown",onDown);
  handle.addEventListener("touchstart",onDown,{passive:true});
}

function validateCouponCode(code,cartValue){
  code=(code||'').trim().toUpperCase();
  if(!code)return{valid:false,message:"Please enter a code."};
  const offer=OFFERS.find(o=>o.code&&o.code.toUpperCase()===code&&o.active!==false);
  if(!offer)return{valid:false,message:"Invalid or inactive coupon code."};
  const now=Date.now();
  if(offer.startDate&&now<new Date(offer.startDate).getTime())return{valid:false,message:"This offer hasn't started yet."};
  if(offer.endDate&&now>new Date(offer.endDate).getTime()+86400000-1)return{valid:false,message:"This offer has expired."};
  if(offer.minOrderAmount&&cartValue<offer.minOrderAmount)return{valid:false,message:"Minimum order of "+money(offer.minOrderAmount)+" required for this offer."};
  if(offer.maxRedemptions){
    const totalUsed=OFFER_REDEMPTIONS.filter(r=>r.offerId===offer.id).length;
    if(totalUsed>=offer.maxRedemptions)return{valid:false,message:"This offer has reached its redemption limit."};
  }
  if(offer.perUserLimit&&AUTH_USER){
    const myUsed=OFFER_REDEMPTIONS.filter(r=>r.offerId===offer.id&&r.uid===AUTH_USER.uid).length;
    if(myUsed>=offer.perUserLimit)return{valid:false,message:"You've already used this offer the maximum number of times."};
  }
  return{valid:true,offer};
}

function calcOfferDiscount(offer,cartValue){
  if(!offer)return 0;
  if(offer.discountType==='fixed'){
    let d=offer.discountValue||0;
    if(offer.maxDiscount)d=Math.min(d,offer.maxDiscount);
    return Math.min(cartValue,d);
  }
  if(offer.discountType==='percentage'){
    let d=Math.round(cartValue*((offer.discountValue||0)/100));
    if(offer.maxDiscount)d=Math.min(d,offer.maxDiscount);
    return Math.min(cartValue,d);
  }
  if(offer.discountType==='free_product'||offer.discountType==='bogo'){
    const fp=calcOfferFreeProduct(offer);
    return fp?fp.price:0;
  }
  return 0; // free_delivery handled separately (zeroes shipping)
}

  if(!reward||reward.rewardType!=='free_item')return null;

  if(r.rewardType==='free_item'){const fp=calcRewardFreeProduct(r);return fp?fp.price:0}
  return 0;
}
function nextMilestoneInfo(completed){

}

  if(!PROFILE.referralCode&&AUTH_USER){
    const code=generateReferralCode(PROFILE.name);
    PROFILE.referralCode=code;saveProfile();
    db.ref('users/'+AUTH_USER.uid+'/referralCode').set(code).catch(()=>{});
  }
  return PROFILE.referralCode||"";
}
function myReferralLink(){
  const code=myReferralCode();
  const base=window.location.origin+window.location.pathname;
  return base+(code?"?ref="+encodeURIComponent(code):"");
}
function recordReferral(code,newUid,newName,newEmail){
  if(!code||REFERRAL_SETTINGS.enabled===false)return;
  db.ref('users').orderByChild('referralCode').equalTo(code).once('value').then(snap=>{
    const v=snap.val();if(!v)return; // invalid code — silently ignore
    const referrerUid=Object.keys(v)[0];
    if(referrerUid===newUid)return; // self-referral guard
    referralsRef.orderByChild('referredUid').equalTo(newUid).once('value').then(existSnap=>{
      if(existSnap.val())return; // duplicate guard — this user already has a referral record
      const campaign=activeReferralCampaign();
      const referrerData=v[referrerUid];
      referralsRef.push({
        referrerUid,referrerName:referrerData.name||"",referrerEmail:referrerData.email||"",
        referredUid:newUid,referredName:newName,referredEmail:newEmail,
        code,campaignId:campaign?campaign.id:null,
        status:'pending',createdAt:Date.now(),completedAt:null
      }).catch(e=>console.warn("Referral record failed:",e));
    });
  }).catch(e=>console.warn("Referral lookup failed:",e));
}
function checkReferralProgress(){
  if(!AUTH_USER||!dataFetched.orders||REFERRAL_SETTINGS.enabled===false)return;
  const mine=REFERRALS_ALL.filter(r=>r.referredUid===AUTH_USER.uid&&r.status==='pending');
  mine.forEach(r=>{
    const campaign=REFERRAL_CAMPAIGNS.find(c=>c.id===r.campaignId);
    if(!campaign||!Array.isArray(campaign.tasks)||campaign.tasks.length===0)return;
    const myCompleted=myCompletedOrdersCount();
    const mySpend=ORDERS.filter(o=>o.uid===AUTH_USER.uid&&isOrderCompleted(o)).reduce((s,o)=>s+(o.amount||0),0);
    const allDone=campaign.tasks.every(t=>{
      if(t.type==='orders_count')return myCompleted>=(t.targetValue||0);
      if(t.type==='min_spend')return mySpend>=(t.targetValue||0);
      return true;
    });
    if(!allDone)return;
    referralsRef.child(r.id).update({status:'completed',completedAt:Date.now()}).then(()=>{
      issueReferralReward(r.referrerUid,r.referrerName,r.referrerEmail,campaign.referrerReward,r.id);
      issueReferralReward(r.referredUid,r.referredName,r.referredEmail,campaign.referredReward,r.id);
      referralsRef.child(r.id).update({status:'rewarded'});
      notifyOnce('referral-done-'+r.id,"Referral Reward Unlocked!","You and your friend both earned a reward for completing the referral tasks.");
    }).catch(e=>console.warn("Referral completion failed:",e));
  });
}
function issueReferralReward(uid,name,email,rewardCfg,referralId){
  if(!uid||!rewardCfg||!rewardCfg.type)return;
  const k=rewardsRef.push().key;
  const expiryAt=rewardCfg.expiryDays?Date.now()+rewardCfg.expiryDays*86400000:null;
  const code='REF'+Math.random().toString(36).slice(2,8).toUpperCase();
  const reward={uid,userName:name||"",userEmail:email||"",userMobile:"",milestoneId:null,referralId,rewardName:rewardCfg.name||"Referral Reward",rewardType:rewardCfg.type,rewardValue:rewardCfg.value||0,code,status:'available',issuedAt:Date.now(),expiryAt,usedAt:null,orderId:null};
  rewardsRef.child(k).set(reward).catch(e=>console.warn("Referral reward issue failed:",e));
}

function safeRender(){
    // Background data listeners (orders/categories/offers/etc.) fire on ANY realtime change,
    // even ones unrelated to the current user. Blindly calling render() while the user is
    // mid checkout/GPS/order-review wipes that screen's DOM and aborts the in-flight
    // geolocation callback. Data (PRODUCTS/ORDERS/etc.) is already updated above regardless;
    // we just skip the destructive re-render while on these protected routes.
    const route=parseRoute().parts[0]||"home";
    const protectedRoutes=["checkout","pay","cod","confirm"];
    if(protectedRoutes.includes(route)) return;
    render();
}

function checkAndRender(){
    // Firebase data is asynchronous and must never keep the whole UI on a loader.
    // Render immediately; individual sections can populate when their listeners return.
    hideSplash();
    checkCitySelection();
    safeRender();
}

    let HOME_MODE='food';
const GROCERY_KEYWORDS=['FRESH','VEGETABLE','FRUIT'];
function catsForMode(mode){
  const map={};
  PRODUCTS.forEach(p=>{
    if(!p.category)return;
    const isGrocery=GROCERY_KEYWORDS.some(k=>p.category.toUpperCase().includes(k));
    const belongs=(mode==='grocery')?isGrocery:!isGrocery;
    if(!belongs)return;
    if(!map[p.category])map[p.category]={name:p.category,imageUrl:(p.imageUrls&&p.imageUrls[0])||''};
  });
  CATEGORIES.filter(c=>c.type===mode).forEach(c=>{
    map[c.name]={name:c.name,imageUrl:c.imageUrl||(map[c.name]?map[c.name].imageUrl:'')};
  });
  return Object.values(map);
}

function checkMinOrderRequirements(){
  const minProducts=Number(CONFIG.minProducts)||0;

  const productCount=CART.reduce((s,c)=>s+c.qty,0);

/* Swipe-down-to-dismiss for the cart sheet — registered once, no per-render listener leak */
(function initCartSheetSwipe(){
  const sheet=document.getElementById("cart-sheet");
  const handle=sheet?.querySelector(".cart-sheet-handle");
  if(!handle)return;
  let startY=0,dragging=false;
  const onStart=e=>{dragging=true;startY=(e.touches?e.touches[0].clientY:e.clientY);sheet.style.transition="none"};
  const onMove=e=>{
    if(!dragging)return;
    const y=(e.touches?e.touches[0].clientY:e.clientY);
    const dy=Math.max(0,y-startY);
    sheet.style.transform=`translateY(${dy}px)`;
  };
  const onEnd=e=>{
    if(!dragging)return;
    dragging=false;
    sheet.style.transition="";
    const y=(e.changedTouches?e.changedTouches[0].clientY:e.clientY);
    const dy=Math.max(0,y-startY);
    sheet.style.transform="";
    if(dy>80)closeCartSheet();
  };
  handle.addEventListener("mousedown",onStart);
  handle.addEventListener("touchstart",onStart,{passive:true});
  window.addEventListener("mousemove",onMove);
  window.addEventListener("touchmove",onMove,{passive:true});
  window.addEventListener("mouseup",onEnd);
  window.addEventListener("touchend",onEnd);
})();
function closeCartSheet(){
  $("#cart-sheet").classList.remove("open");
  $("#cart-sheet-backdrop").classList.remove("open");
  if(location.hash.startsWith("#/cart")){
    routeTo("#/vendor"); // deterministic — never depend on the browser history stack, which can be empty/stale and strand the hash on #/cart, causing the sheet to silently reopen on the next background re-render
  }
}


function finalizeCOD(){
  const pend=readLocal("sf_pending",null);if(!pend){alert("No pending order.");return}
  try{
    const k=db.ref('orders').push().key;
    const isOnline=pend.paymentMethod==="online";
    const raw={...pend,firebaseKey:k,createdAt:Date.now(),status:isOnline?"Online Payment - Verifying":"COD - Placed",trackingUrl:"",deliveryBoy:null,deliveryStatus:"New Order"};
    const data=JSON.parse(JSON.stringify(raw)); // strips undefined fields (e.g. deleted product) that make Firebase .set() throw synchronously
    db.ref('orders/'+k).set(data).then(()=>{
      writeLocal("sf_last_order",data);localStorage.removeItem("sf_pending");CART=[];saveCart();closeCartSheet();
      if(pend.rewardApplied?.rewardId){db.ref('rewards/'+pend.rewardApplied.rewardId).update({status:'used',usedAt:Date.now(),orderId:pend.orderId}).catch(e=>console.warn("Reward mark-used failed:",e))}
      if(pend.offerApplied?.offerId){offerRedemptionsRef.push({offerId:pend.offerApplied.offerId,code:pend.offerApplied.code,uid:AUTH_USER?AUTH_USER.uid:null,userEmail:PROFILE.email,orderId:pend.orderId,redeemedAt:Date.now()}).catch(e=>console.warn("Offer redemption record failed:",e))}
      routeTo("#/cod/success")
    }).catch(err=>{console.error("Order sync failed:",err);alert("Failed to place order: "+(err.message||"Please try again."))});
  }catch(err){
    console.error("Order build failed:",err);
    alert("Failed to place order: "+(err.message||"Please try again."));
  }
}

  const todayOrders=myOrders.filter(o=>o.createdAt>=startOfDay);
  const byStage=s=>myOrders.filter(o=>(o.deliveryStatus||'New Order')===s&&!(o.status&&o.status.includes('Cancelled'))).length;
  const completedToday=todayOrders.filter(o=>isOrderCompleted(o));
  const myProductIds=new Set(PRODUCTS.filter(p=>p.vendorUid===v.uid).map(p=>p.id));
  const todayEarnings=completedToday.reduce((s,o)=>{
    let orderEarn=0;
    (o.items||[]).forEach(it=>{
      if(!myProductIds.has(it.productId))return;
      const p=PRODUCTS.find(x=>x.id===it.productId);
      const earning=(p&&p.vendorEarnings!==undefined)?p.vendorEarnings:0;
      orderEarn+=earning*it.qty;
    });
    return s+orderEarn;
  },0);
  const isOnline=(v.availabilityStatus||(v.online?'Live':'Offline'))==='Live';

  $("#view").innerHTML=`
    <section style="padding:14px">
      <div class="card pad" style="display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--accent),var(--accentDark));color:#fff;border:none">
        ${v.logoUrl?`<img src="${v.logoUrl}" style="width:52px;height:52px;border-radius:14px;object-fit:cover;flex-shrink:0">`:`<div style="width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:22px;flex-shrink:0"><i class="fa-solid fa-store"></i></div>`}
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-family:Poppins;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(v.restaurantName)}</div>
          <div style="font-size:12px;opacity:.9">${escapeHtml(v.category||'')}</div>
        </div>
      </div>

      <div class="card pad" style="margin-top:12px;display:flex;align-items:center;justify-content:space-between">
        <div><div style="font-weight:700">${isOnline?'You are Online':'You are Offline'}</div><div class="muted" style="font-size:12px">${isOnline?'Accepting new orders':'Not receiving new orders — other restaurants stay open'}</div></div>
        <label style="position:relative;display:inline-block;width:52px;height:30px">
          <input type="checkbox" id="vendor-online-toggle" ${isOnline?'checked':''} style="opacity:0;width:0;height:0">

          <span id="vendor-online-knob" style="position:absolute;top:3px;left:${isOnline?'25px':'3px'};width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)"></span>
        </label>
      </div>

      <h3 style="margin:16px 0 8px;font-family:Poppins;color:var(--accentDark)">Today</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="card pad" style="text-align:center;padding:12px"><div style="font-size:20px;font-weight:800;color:var(--accentDark)">${todayOrders.length}</div><div class="muted" style="font-size:11px">Today's Orders</div></div>
        <div class="card pad" style="text-align:center;padding:12px"><div style="font-size:20px;font-weight:800;color:var(--success)">${money(todayEarnings)}</div><div class="muted" style="font-size:11px">Today's Earnings</div></div>
      </div>

      <h3 style="margin:16px 0 8px;font-family:Poppins;color:var(--accentDark)"><i class="fa-solid fa-wallet"></i> Earnings</h3>
      ${(()=>{
        const myProductIds=new Set(PRODUCTS.filter(p=>p.vendorUid===v.uid).map(p=>p.id));
        const now2=new Date();const startWeek=new Date(now2);startWeek.setDate(now2.getDate()-now2.getDay());startWeek.setHours(0,0,0,0);
        const startMonth=new Date(now2.getFullYear(),now2.getMonth(),1).getTime();
        let weekEarn=0,monthEarn=0,totalEarn=0,totalSales=0,orderCount=0;
        ORDERS.filter(o=>isOrderCompleted(o)&&o.items&&o.items.some(it=>myProductIds.has(it.productId))).forEach(o=>{
          let touched=false;
          o.items.forEach(it=>{
            if(!myProductIds.has(it.productId))return;
            touched=true;
            const p=PRODUCTS.find(x=>x.id===it.productId);
            const earning=(p&&p.vendorEarnings!==undefined)?p.vendorEarnings:0;
            totalSales+=(it.price||0)*it.qty;totalEarn+=earning*it.qty;
            if(o.createdAt>=startWeek.getTime())weekEarn+=earning*it.qty;
            if(o.createdAt>=startMonth)monthEarn+=earning*it.qty;
          });
          if(touched)orderCount++;
        });
        return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <div class="card pad" style="text-align:center;padding:12px"><div style="font-size:18px;font-weight:800;color:var(--accentDark)">${money(totalSales)}</div><div class="muted" style="font-size:11px">Total Sales</div></div>
          <div class="card pad" style="text-align:center;padding:12px"><div style="font-size:18px;font-weight:800;color:var(--success)">${money(totalEarn)}</div><div class="muted" style="font-size:11px">Total Earnings</div></div>
        </div>`;
      })()}

      <div class="del-stat-grid">
        <div class="del-stat"><div class="num">${byStage('New Order')}</div><div class="lbl">Pending</div></div>
        <div class="del-stat"><div class="num">${byStage('Accepted')}</div><div class="lbl">Accepted</div></div>
        <div class="del-stat"><div class="num">${byStage('Preparing')}</div><div class="lbl">Preparing</div></div>
        <div class="del-stat"><div class="num">${byStage('Ready for Pickup')}</div><div class="lbl">Ready</div></div>
        <div class="del-stat"><div class="num">${byStage('Delivered')}</div><div class="lbl">Completed</div></div>
        <div class="del-stat"><div class="num">${myOrders.filter(o=>o.status&&o.status.includes('Cancelled')).length}</div><div class="lbl">Cancelled</div></div>
      </div>

      <div style="display:flex;gap:10px;margin-top:16px">
        <a class="btn btn-block" href="#/vendor/orders"><i class="fa-solid fa-clipboard-list"></i> Manage Orders</a>
      </div>
      <div style="display:flex;gap:10px;margin-top:10px">
        <a class="btn btn-outline btn-block" href="#/vendor/settings"><i class="fa-solid fa-gear"></i> Settings</a>
        <a class="btn btn-outline btn-block" href="#/vendor/help"><i class="fa-solid fa-circle-question"></i> Help</a>
      </div>
    </section>`;
  $("#vendor-online-toggle").addEventListener("change",e=>{
    const status=e.target.checked?'Live':'Offline';
    // Update UI immediately for responsiveness
    const slider=$("#vendor-online-slider");
    const knob=$("#vendor-online-knob");
    if(slider){slider.style.background=e.target.checked?'var(--success)':'#ccc'}
    if(knob){knob.style.left=e.target.checked?'25px':'3px'}
    // Sync with Firebase
    vendorsRef.child(v.uid).update({availabilityStatus:status,online:e.target.checked}).then(()=>toast(e.target.checked?"You're online — accepting orders":"You're offline — your restaurant is paused")).catch(err=>{e.target.checked=!e.target.checked;alert("Failed to update status. Try again.")});
  });
}

let _seenVendorOrderIds=null;
function VendorOrdersView(){
  const v=myVendorRecord();
  if(!v||v.status!=='Approved'){routeTo("#/vendor");return}
  setTopbar("Manage Orders",true);setActiveTab("");
  const active=ORDERS.filter(o=>!isOrderCompleted(o)&&!(o.status&&o.status.includes('Cancelled'))).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  const currentIds=new Set(active.map(o=>o.firebaseKey));
  if(_seenVendorOrderIds===null){_seenVendorOrderIds=currentIds}
  else{
    const newOnes=active.filter(o=>!_seenVendorOrderIds.has(o.firebaseKey)&&(o.deliveryStatus||'New Order')==='New Order');
    _seenVendorOrderIds=currentIds;
    if(newOnes.length>0)showVendorNewOrderPopup(newOnes[0]);
  }

  $("#view").innerHTML=`
    <section style="padding:14px">
      <h3 style="margin:0 0 12px;font-family:Poppins;color:var(--accentDark)">Active Orders (${active.length})</h3>
      ${active.length===0?'<div class="card pad muted" style="text-align:center">No active orders right now.</div>':active.map(o=>{
        const stage=o.deliveryStatus||'New Order';
        return `<div class="del-order-card">
          <div class="del-header"><strong>#${escapeHtml(o.orderId)}</strong><span class="del-status-chip ${delStatusClass(stage)}">${escapeHtml(stage)}</span></div>
          <div style="font-weight:600">${escapeHtml(o.customer?.name||'Customer')}</div>
          <div class="del-items">${o.items?.map(i=>i.name+' x'+i.qty).join(', ')||''}</div>
          <div style="font-weight:700;margin:6px 0;color:var(--accentDark)">${money(o.amount)}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
            ${stage==='New Order'?`<button class="btn btn-sm btn-success" data-accept="${o.firebaseKey}"><i class="fa-solid fa-check"></i> Accept</button><button class="btn btn-sm btn-danger" data-reject="${o.firebaseKey}"><i class="fa-solid fa-xmark"></i> Reject</button>`:''}
            ${stage==='Accepted'?`<button class="btn btn-sm" style="background:#B45309" data-stage="${o.firebaseKey}" data-to="Preparing"><i class="fa-solid fa-fire-burner"></i> Start Preparing</button>`:''}
            ${stage==='Preparing'?`<button class="btn btn-sm" style="background:#6D28D9" data-stage="${o.firebaseKey}" data-to="Ready for Pickup"><i class="fa-solid fa-box"></i> Mark Ready</button>${(VENDOR_SETTINGS.extraTimeOptions||[5,10,15,20]).map(m=>`<button class="btn btn-sm btn-outline" data-addtime="${o.firebaseKey}" data-mins="${m}">+${m} min</button>`).join('')}`:''}
            ${stage==='Ready for Pickup'&&!o.deliveryBoy?`<span class="muted" style="font-size:12px;align-self:center"><i class="fa-solid fa-motorcycle"></i> Waiting for Admin to assign delivery boy</span>`:''}
            ${o.deliveryBoy?`<span class="muted" style="font-size:12px;align-self:center">Delivery: ${escapeHtml(o.deliveryBoy.name||'')}</span>`:''}
          </div>
        </div>`;
      }).join('')}
    </section>`;
  $$("[data-accept]").forEach(b=>b.addEventListener("click",()=>openPrepTimeModal(b.dataset.accept)));
  $$("[data-reject]").forEach(b=>b.addEventListener("click",()=>{if(confirm("Reject this order?"))db.ref('orders/'+b.dataset.reject).update({status:'Cancelled by Restaurant',deliveryStatus:'New Order'}).then(()=>toast("Order rejected"))}));
  $$("[data-stage]").forEach(b=>b.addEventListener("click",()=>updateOrderStage(b.dataset.stage,b.dataset.to)));
  $$("[data-addtime]").forEach(b=>b.addEventListener("click",()=>{
    const o=ORDERS.find(x=>x.firebaseKey===b.dataset.addtime);if(!o)return;
    const add=parseInt(b.dataset.mins)||10;
    const cur=o.prepTimeMinutes||30;const max=VENDOR_SETTINGS.maxPrepMinutes||120;
    const next=Math.min(max,cur+add);
    db.ref('orders/'+o.firebaseKey).update({prepTimeMinutes:next}).then(()=>toast("Prep time updated: "+next+" min"));
  }));
}
function openPrepTimeModal(orderKey){
  const options=[15,20,25,30,35,40,45,50,60];
  const div=document.createElement("div");
  div.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px";
  div.innerHTML=`<div class="card pad" style="max-width:340px;width:100%">
    <h3 style="margin:0 0 4px;font-family:Poppins;color:var(--accentDark)">Accept Order</h3>
    <p class="muted" style="font-size:13px;margin:0 0 12px">Select estimated preparation time — this will show to the customer immediately.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${options.map(m=>`<button class="btn btn-outline btn-sm" data-preptime-pick="${m}">${m} min</button>`).join('')}
    </div>
    <button class="btn btn-block" style="margin-top:14px;background:#eee;color:#111" id="preptime-cancel">Cancel</button>
  </div>`;
  document.body.appendChild(div);
  div.querySelectorAll("[data-preptime-pick]").forEach(btn=>btn.addEventListener("click",()=>{
    const mins=parseInt(btn.dataset.preptimePick);
    db.ref('orders/'+orderKey).update({deliveryStatus:'Accepted',prepTimeMinutes:mins}).then(()=>{toast("Order accepted — "+mins+" min prep time set");div.remove()}).catch(()=>alert("Failed."));
  }));
  $("#preptime-cancel").addEventListener("click",()=>div.remove());
}
function updateOrderStage(key,stage){
  db.ref('orders/'+key).update({deliveryStatus:stage}).then(()=>toast("Order updated: "+stage)).catch(()=>alert("Failed."));
}
function showVendorNewOrderPopup(o){
  if(document.getElementById("vendor-order-modal"))return; // avoid stacking popups if another new order arrives mid-alert
  startRingtone();
  let seconds=30;
  const div=document.createElement("div");
  div.id="vendor-order-modal";
  div.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:flex;align-items:center;justify-content:center;padding:20px";
  div.innerHTML=`<div class="card pad" style="max-width:360px;width:100%;text-align:center">
    <div class="ring-pulse" style="width:60px;height:60px;border-radius:50%;background:var(--accentLight);display:grid;place-items:center;margin:0 auto 12px;font-size:26px;color:var(--accent)"><i class="fa-solid fa-bell"></i></div>
    <h2 style="margin:0 0 4px;font-family:Poppins;color:var(--accentDark)">New Order!</h2>
    <div class="muted" style="font-size:13px;margin-bottom:10px">#${escapeHtml(o.orderId)}</div>
    <div style="text-align:left;background:var(--accentLight);border-radius:10px;padding:10px;margin-bottom:12px">
      ${(o.items||[]).map(it=>`<div class="row" style="font-size:13px"><div>${escapeHtml(it.name)} x${it.qty}</div></div>`).join('')}
      <div class="row" style="font-weight:800;color:var(--accentDark);margin-top:6px"><div>Total</div><div>${money(o.amount)}</div></div>
    </div>
    <div id="vendor-order-timer" style="font-weight:700;color:#D97706;margin-bottom:10px">Auto-closing in ${seconds}s</div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-outline btn-block" id="vendor-order-reject">Reject</button>
      <button class="btn btn-success btn-block" id="vendor-order-accept">Accept</button>
    </div>
  </div>`;
  document.body.appendChild(div);
  const timer=setInterval(()=>{
    seconds--;
    const el=document.getElementById('vendor-order-timer');
    if(el)el.textContent="Auto-closing in "+seconds+"s";
    if(seconds<=0){clearInterval(timer);stopRingtone();div.remove()}
  },1000);
  $("#vendor-order-accept").addEventListener("click",()=>{clearInterval(timer);stopRingtone();updateOrderStage(o.firebaseKey,"Accepted");div.remove();routeTo("#/vendor/orders")});
  $("#vendor-order-reject").addEventListener("click",()=>{clearInterval(timer);stopRingtone();db.ref('orders/'+o.firebaseKey).update({status:'Cancelled by Restaurant'}).then(()=>toast("Order rejected"));div.remove()});
}

  });
}

/* ===== Custom Time Picker (fixes Android WebView native time input missing OK/Save button) ===== */
function timePickerHtml(idPrefix,presetTime){
  let h12=9,m=0,ap='AM';
  if(presetTime){
    const parts=presetTime.split(':');
    const hh=parseInt(parts[0]);const mm=parseInt(parts[1]);
    if(!isNaN(hh)&&!isNaN(mm)){ap=hh>=12?'PM':'AM';h12=hh%12===0?12:hh%12;m=mm}
  }
  const hours=Array.from({length:12},(_,i)=>i+1);
  const mins=Array.from({length:60},(_,i)=>i);
  return `<div class="time-picker-row" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <select id="${idPrefix}-h" style="flex:1;min-width:64px">${hours.map(x=>`<option value="${x}" ${x===h12?'selected':''}>${String(x).padStart(2,'0')}</option>`).join('')}</select>
    <span style="font-weight:700">:</span>
    <select id="${idPrefix}-m" style="flex:1;min-width:64px">${mins.map(x=>`<option value="${x}" ${x===m?'selected':''}>${String(x).padStart(2,'0')}</option>`).join('')}</select>
    <select id="${idPrefix}-ap" style="flex:1;min-width:70px"><option value="AM" ${ap==='AM'?'selected':''}>AM</option><option value="PM" ${ap==='PM'?'selected':''}>PM</option></select>
    <button type="button" class="btn btn-sm btn-success" id="${idPrefix}-ok" style="flex-shrink:0"><i class="fa-solid fa-check"></i> OK</button>
  </div>
  <div id="${idPrefix}-confirm" class="muted" style="font-size:12px;margin-top:4px;color:var(--success);display:${presetTime?'block':'none'}"><i class="fa-solid fa-circle-check"></i> Saved: <span id="${idPrefix}-confirm-text">${presetTime?formatTime12(presetTime):''}</span></div>`;
}
function wireTimePickerOk(idPrefix){
  const btn=document.getElementById(idPrefix+'-ok');
  if(!btn)return;
  btn.addEventListener("click",()=>{
    const val=readTimePicker(idPrefix);
    const confirmEl=document.getElementById(idPrefix+'-confirm');
    const textEl=document.getElementById(idPrefix+'-confirm-text');
    if(textEl)textEl.textContent=formatTime12(val);
    if(confirmEl)confirmEl.style.display="block";
    toast("Time saved: "+formatTime12(val));
  });
}
function readTimePicker(idPrefix){
  const hEl=document.getElementById(idPrefix+'-h'),mEl=document.getElementById(idPrefix+'-m'),apEl=document.getElementById(idPrefix+'-ap');
  if(!hEl||!mEl||!apEl)return"";
  let h24=parseInt(hEl.value)%12;
  if(apEl.value==='PM')h24+=12;
  return String(h24).padStart(2,'0')+':'+String(parseInt(mEl.value)).padStart(2,'0');
}
function formatTime12(t){
  if(!t)return'—';
  const parts=t.split(':');const hh=parseInt(parts[0]),mm=parseInt(parts[1]);
  if(isNaN(hh)||isNaN(mm))return t;
  const ap=hh>=12?'PM':'AM';const h12=hh%12===0?12:hh%12;
  return String(h12).padStart(2,'0')+':'+String(mm).padStart(2,'0')+' '+ap;
}

function fallbackCopyText(text){
  try{
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";ta.style.top="0";
    document.body.appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    toast(ok?"Code copied!":"Couldn't copy — code is "+text);
  }catch(e){toast("Couldn't copy — code is "+text)}
}

async function compressToDataURL(file,maxW=1200,maxH=1200,quality=.85){const img=await fileToImage(file);const[w,h]=fitRect(img.naturalWidth,img.naturalHeight,maxW,maxH);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);return c.toDataURL("image/jpeg",quality)}
function fitRect(w,h,mW,mH){const r=Math.min(mW/w,mH/h,1);return[Math.round(w*r),Math.round(h*r)]}
function fileToImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function popConfetti(){const c=$("#confetti");if(!c)return;c.innerHTML="";const colors=["#145A32","#0d3d22","#a3d98a","#4a8a30","#8ed070"];for(let i=0;i<24;i++){const s=document.createElement("span");s.style.left=(4+Math.random()*92)+"%";s.style.background=colors[Math.floor(Math.random()*colors.length)];s.style.animationDelay=(Math.random()*.6)+"s";c.appendChild(s)}}
function playSuccessSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.setValueAtTime(660,ctx.currentTime);g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.3,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.42);setTimeout(()=>ctx.close(),600)}catch(e){}}

/* ===== LIVE DELIVERY TRACKING SYSTEM ===== */
let liveLocationIntervalId=null;
let currentTrackingOrderKey=null;

function startLiveLocationTracking(orderKey){
  currentTrackingOrderKey=orderKey;
  if(liveLocationIntervalId)clearInterval(liveLocationIntervalId);
  
  function updateLocation(){
    if(!USER_LIVE_LOCATION)return;
    const locData={lat:USER_LIVE_LOCATION.lat,lng:USER_LIVE_LOCATION.lng,timestamp:Date.now()};
    db.ref('orders/'+orderKey+'/liveLocation').set(locData).catch(err=>console.warn("Live location update failed:",err));
  }
  
  updateLocation();
  liveLocationIntervalId=setInterval(updateLocation,3000);
}

function stopLiveLocationTracking(){
  if(liveLocationIntervalId){clearInterval(liveLocationIntervalId);liveLocationIntervalId=null}
  currentTrackingOrderKey=null;
}

function calculateDistance(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return(R*c).toFixed(1);
}

function calculateETA(distance,avgSpeed=40){
  const hours=distance/avgSpeed;
  const minutes=Math.round(hours*60);
  if(minutes<1)return"< 1 min";
  if(minutes<60)return minutes+" min";
  const h=Math.floor(minutes/60);
  const m=minutes%60;
  return h+"h "+m+"m";
}

function render(){

  // Products/config may be temporarily unavailable; the app must still render.
  hideSplash();
  initAuthListenerOnce();
  const[r,id,sub]=parts;
  const authScreens=["login","signup","forgot-password"];
  if(getAuth()&&!AUTH_USER&&!authScreens.includes(r)){routeTo("#/login");return}

  if(r==="login")LoginView();
  else if(r==="signup")SignupView();
  else if(r==="forgot-password")ForgotPasswordView();
