window.addEventListener('error',function(e){
  function show(){
    var box=document.createElement('div');
    box.style.cssText='position:fixed;inset:0;z-index:999999;background:#1a1a1a;color:#fff;padding:20px;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap';
    box.textContent='JS ERROR CAUGHT:\n\n'+(e.message||'')+'\n\nFile: '+(e.filename||'')+'\nLine: '+(e.lineno||'')+':'+(e.colno||'')+'\n\n'+(e.error&&e.error.stack||'');
    (document.body||document.documentElement).appendChild(box);
  }
  if(document.body)show();else document.addEventListener('DOMContentLoaded',show);
});
</script>

<style>

.slide-track{position:relative;height:58px;border-radius:999px;overflow:hidden;user-select:none;touch-action:none}
.slide-track .slide-fill{position:absolute;inset:0;width:0;transition:width .05s linear}
.slide-track .slide-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;letter-spacing:.3px;pointer-events:none;z-index:1}
.slide-track .slide-handle{position:absolute;top:4px;left:4px;width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:grab;z-index:2;transition:left .05s linear}
.new-order-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;display:none;align-items:flex-end;justify-content:center}
.new-order-modal-backdrop.open{display:flex}
.new-order-modal{background:#fff;border-radius:22px 22px 0 0;max-width:var(--container);width:100%;max-height:88vh;overflow-y:auto;animation:authPopIn .35s cubic-bezier(.16,1,.3,1);padding-bottom:calc(20px + var(--safe))}
@media(min-width:760px){.new-order-modal-backdrop{align-items:center}.new-order-modal{border-radius:22px;margin:20px}}
@keyframes ringPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.ring-pulse{animation:ringPulse 1s ease-in-out infinite}

/* Apple Glass (glassmorphism) popup */
.glass-backdrop{position:fixed;inset:0;background:rgba(10,20,15,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s ease}
.glass-backdrop.show{opacity:1}
.glass-card{background:rgba(255,255,255,.55);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid rgba(255,255,255,.6);border-radius:26px;box-shadow:0 20px 60px rgba(13,58,51,.35),0 2px 8px rgba(0,0,0,.1);max-width:360px;width:100%;padding:26px 22px;text-align:center;transform:scale(.9);opacity:0;transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s ease}
.glass-backdrop.show .glass-card{transform:scale(1);opacity:1}
.glass-icon{width:64px;height:64px;border-radius:50%;background:rgba(20,90,50,.12);border:1px solid rgba(20,90,50,.2);display:grid;place-items:center;margin:0 auto 14px;font-size:28px;color:var(--accentDark)}
.glass-stat-row{display:flex;gap:10px;margin-top:16px}
.glass-stat{flex:1;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);border-radius:16px;padding:12px 8px}
.glass-stat .num{font-weight:800;font-size:18px;color:var(--accentDark);font-family:Poppins}
.glass-stat .lbl{font-size:11px;color:#3a4a44;margin-top:2px}

/* Reward unlock confetti animation */
.confetti-piece{position:absolute;top:-10px;width:8px;height:14px;opacity:0;animation:confettiFall 2.2s ease-in forwards}
@keyframes confettiFall{
  0%{opacity:1;transform:translateY(0) rotate(0deg)}
  100%{opacity:0;transform:translateY(420px) rotate(540deg)}
}
@keyframes rewardPopIn{
  0%{transform:scale(.6) translateY(20px);opacity:0}
  60%{transform:scale(1.05) translateY(0);opacity:1}
  100%{transform:scale(1) translateY(0);opacity:1}
}
.reward-unlock-card{animation:rewardPopIn .5s cubic-bezier(.16,1,.3,1)}

/* ===== Premium Loyalty Card ===== */
@keyframes loyaltyCardIn{0%{opacity:0;transform:translateY(14px) scale(.98)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes loyaltyShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes loyaltyFillIn{0%{width:0}}
.loyalty-card-premium{position:relative;margin:0 14px 14px;border-radius:20px;overflow:hidden;color:#fff;cursor:pointer;animation:loyaltyCardIn .5s cubic-bezier(.16,1,.3,1);box-shadow:0 10px 30px rgba(13,58,51,.25);transition:transform .2s ease}
.loyalty-card-premium:active{transform:scale(.98)}
.loyalty-card-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.loyalty-card-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(13,58,51,.88),rgba(20,90,50,.72));z-index:1}
.loyalty-card-content{position:relative;z-index:2;padding:16px}
.loyalty-card-shine{position:absolute;inset:0;z-index:1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.16) 45%,transparent 60%);background-size:250% 100%;animation:loyaltyShimmer 3.2s ease-in-out infinite}
.loyalty-reward-thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);flex-shrink:0}
.loyalty-progress-track{margin-top:10px;background:rgba(255,255,255,.25);border-radius:999px;height:9px;overflow:hidden}
.loyalty-progress-fill{height:100%;background:linear-gradient(90deg,#fff,#d4e8dc);border-radius:999px;transition:width .8s cubic-bezier(.16,1,.3,1);animation:loyaltyFillIn .8s cubic-bezier(.16,1,.3,1)}
.loyalty-view-all-btn{font-weight:700;font-size:12px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px;white-space:nowrap;transition:background .2s ease}
.loyalty-view-all-btn:hover{background:rgba(255,255,255,.3)}

/* ===== Reward details popup ===== */
.reward-popup-card{max-width:380px}
.reward-popup-image{width:100%;height:140px;object-fit:cover;border-radius:16px;margin-bottom:14px;border:1px solid rgba(255,255,255,.6)}
.reward-popup-code{font-family:monospace;font-weight:800;letter-spacing:1px;background:rgba(20,90,50,.1);border:1px dashed rgba(20,90,50,.35);border-radius:12px;padding:10px;margin:10px 0;font-size:16px;color:var(--accentDark)}

/* ===== In Progress milestone card ===== */
.milestone-progress-card{position:relative;border-radius:18px;overflow:hidden;margin-bottom:12px;background:linear-gradient(135deg,#fff,#f4faf6);border:1px solid var(--line);box-shadow:var(--shadow-sm);animation:loyaltyCardIn .4s cubic-bezier(.16,1,.3,1)}
.milestone-progress-inner{display:flex;gap:12px;padding:14px;align-items:center}
.milestone-progress-track{margin-top:8px;background:var(--accentLight);border-radius:999px;height:8px;overflow:hidden}
.milestone-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accentDark));border-radius:999px;transition:width .8s cubic-bezier(.16,1,.3,1)}
.reward-status-card{transition:transform .2s ease,box-shadow .2s ease;animation:loyaltyCardIn .4s cubic-bezier(.16,1,.3,1)}
.reward-status-card:active{transform:scale(.98)}
.del-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.del-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.del-stat .num{font-size:24px;font-weight:700;font-family:Poppins;color:var(--accent)}
.del-stat .lbl{font-size:11px;color:var(--muted);margin-top:2px}

/* City Modal Overlay */
#city-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);
  z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;
}
.city-modal-box{background:#fff;width:100%;max-width:400px;border-radius:24px;padding:24px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.2)}
.city-option{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;cursor:pointer;transition:all 0.2s;font-weight:600;}
.city-option:hover{border-color:var(--accent);background:var(--accentLight);}


/* Store Lock Banner */
.lock-banner{background:#FEE2E2; color:#E11D48; padding:12px; text-align:center; font-weight:bold; border-bottom:1px solid #FECACA;}
</style>

window.addEventListener('error',function(e){
  function show(){
    var box=document.createElement('div');
    box.style.cssText='position:fixed;inset:0;z-index:999999;background:#1a1a1a;color:#fff;padding:20px;font-family:monospace;font-size:13px;overflow:auto;white-space:pre-wrap';
    box.textContent='JS ERROR CAUGHT:\n\n'+(e.message||'')+'\n\nFile: '+(e.filename||'')+'\nLine: '+(e.lineno||'')+':'+(e.colno||'')+'\n\n'+(e.error&&e.error.stack||'');
    (document.body||document.documentElement).appendChild(box);
  }
  if(document.body)show();else document.addEventListener('DOMContentLoaded',show);
});

const $$=s=>Array.from(document.querySelectorAll(s));

const readLocal=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}};
const writeLocal=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const escapeHtml=(s="")=>s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

/* ===== Reliability helpers ===== */
function safeDateValue(v){const n=Number(v);return Number.isFinite(n)&&n>0?new Date(n):null}
function safeDateText(v,mode="date"){const d=safeDateValue(v);if(!d)return"—";try{return mode==="datetime"?d.toLocaleString():d.toLocaleDateString()}catch(e){return"—"}}
function isValidOrderRecord(o){return !!(o&&o.firebaseKey&&o.orderId&&Number.isFinite(Number(o.createdAt))&&o.customer&&typeof o.customer==='object'&&Number.isFinite(Number(o.customer.lat))&&Number.isFinite(Number(o.customer.lng))&&Array.isArray(o.items)&&o.items.length>0)}
function prepRangeText(p){if(!p)return"";const min=Number(p.prepTimeMin||p.prepTimeMinutes||0);const max=Number(p.prepTimeMax||min);if(!Number.isFinite(min)||min<=0)return"";return max>min?`${min}–${max} Minutes`:`${min} Minutes`}

/* ===== Avatar ===== */
function avatarHtml(size,onColor){
  size=size||34;
  const initial=((PROFILE.name||AUTH_USER?.email||"U").trim().charAt(0)||"U").toUpperCase();
  if(PROFILE.avatar){
    return `<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;flex-shrink:0;${onColor?'border:2px solid rgba(255,255,255,.5)':'border:2px solid var(--line)'}"><img src="${PROFILE.avatar}" style="width:100%;height:100%;object-fit:cover"></div>`;
  }
  const bg=onColor?'rgba(255,255,255,.25)':'var(--accent)';
  const border=onColor?'2px solid rgba(255,255,255,.5)':'2px solid var(--accentDark)';
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${Math.round(size*0.42)}px;flex-shrink:0;border:${border}">${escapeHtml(initial)}</div>`;
}

/* ===== Zomato-style Live Location System ===== */
let USER_LIVE_LOCATION=readLocal("sf_live_location",null);
function updateHeaderLocationLabel(){
  const el=document.getElementById('home-location-label');
  if(el)el.innerHTML=`<i class="fa-solid fa-location-dot"></i> ${escapeHtml(USER_LIVE_LOCATION?USER_LIVE_LOCATION.label:USER_CITY)}`;
}
function reverseGeocode(lat,lng){
  return fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=16`)
    .then(r=>r.json())
    .then(d=>{
      const a=d.address||{};
      return a.suburb||a.neighbourhood||a.village||a.town||a.city_district||a.city||(d.display_name?d.display_name.split(',')[0]:"Current Location");
    }).catch(()=>"Current Location");
}
let ZESTO_LOCATION_PROMPT_SHOWN=readLocal("sf_loc_popup_shown",false);
async function getGeoPermissionState(){
  try{
    if(!navigator.permissions||!navigator.permissions.query)return null;
    const p=await navigator.permissions.query({name:"geolocation"});
    return p.state;
  }catch(e){return null}
}
async function fetchLiveLocation(showPopupOnFail){
  if(!navigator.geolocation){if(showPopupOnFail)alert("Geolocation is not supported on this device.");return}
  const perm=await getGeoPermissionState();
  if(perm==="denied"){
    if(showPopupOnFail||!ZESTO_LOCATION_PROMPT_SHOWN){
      ZESTO_LOCATION_PROMPT_SHOWN=true;writeLocal("sf_loc_popup_shown",true);showLocationPermissionPopup();
    }
    return;
  }
  navigator.geolocation.getCurrentPosition(pos=>{
    const{latitude,longitude}=pos.coords;
    ZESTO_LOCATION_PROMPT_SHOWN=false;writeLocal("sf_loc_popup_shown",false);
    reverseGeocode(latitude,longitude).then(label=>{
      USER_LIVE_LOCATION={lat:latitude,lng:longitude,label,updatedAt:Date.now()};
      writeLocal("sf_live_location",USER_LIVE_LOCATION);
      updateHeaderLocationLabel();
    });
  },async err=>{
    console.warn("Location error:",err);
    const state=await getGeoPermissionState();
    if(state==="granted")return;
    if(showPopupOnFail||!ZESTO_LOCATION_PROMPT_SHOWN){
      ZESTO_LOCATION_PROMPT_SHOWN=true;writeLocal("sf_loc_popup_shown",true);showLocationPermissionPopup();
    }
  },{enableHighAccuracy:true,maximumAge:60000,timeout:15000});
}
const toast=msg=>{const t=$("#toast");if(!t)return;t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1400)};
function requestLocationOnce(timeoutMs=12000){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){reject(new Error('Geolocation is not supported in this app.'));return}
    let done=false;
    const finish=(fn,v)=>{if(done)return;done=true;clearTimeout(timer);fn(v)};
    const timer=setTimeout(()=>finish(reject,new Error('Location request timed out. Please enable device Location and try again.')),timeoutMs);
    navigator.geolocation.getCurrentPosition(
      p=>finish(resolve,{lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy||null,updatedAt:Date.now()}),
      e=>finish(reject,e),
      {enableHighAccuracy:true,maximumAge:0,timeout:Math.min(10000,timeoutMs-1000)}
    );
  });
}
const routeTo=hash=>{location.hash=hash};

let PROFILE=readLocal("sf_profile",{name:"",email:"",phone:"",address:"",pincode:"",city:"",state:"",district:"",landmark:"",avatar:"",isComplete:false,favorites:[]});
const saveProfile=()=>{
  writeLocal("sf_profile",PROFILE);
  const a=getAuth();
  if(a&&a.currentUser){
    db.ref("users/"+a.currentUser.uid).update({
      name:PROFILE.name||"",
      email:PROFILE.email||"",
      mobile:PROFILE.phone||"",
      address:PROFILE.address||"",
      pincode:PROFILE.pincode||"",
      city:PROFILE.city||"",
      state:PROFILE.state||"",
      district:PROFILE.district||"",
      landmark:PROFILE.landmark||"",
      avatar:PROFILE.avatar||""
    }).catch(e=>console.warn("[profile] Firebase profile sync failed:",e&&e.code,e&&e.message));
  }
};
const hasCompleteProfile=()=>!!(PROFILE.name&&PROFILE.email&&PROFILE.phone&&PROFILE.address&&PROFILE.pincode);

function stopPrivateListeners(){
  try{
    ordersRef.off('value');

function refreshPrivateListeners(){
  const a=getAuth();
  const uid=a&&a.currentUser?a.currentUser.uid:null;

function initAuthListenerOnce(){

    a.onAuthStateChanged(user=>{
      // Firebase Auth is the ONLY source of truth for login state. AUTH_USER
      // must always mirror firebase currentUser exactly — never derived from
      // cached PROFILE/localStorage data.
      AUTH_USER=user;
      authBootHandled=true;
      console.log("[auth] onAuthStateChanged fired. currentUser:",a.currentUser?a.currentUser.uid:null,"AUTH_USER:",AUTH_USER?AUTH_USER.uid:null);
      if(user){

  PROFILE.referralCode=u.referralCode||PROFILE.referralCode;
}
          checkAndAwardLoyalty();checkReferralProgress();
          if(typeof render==="function")render();
        }).catch(e=>{console.warn("Profile load failed:",e);if(typeof render==="function")render()});
      }else{

        ORDERS=[];RATINGS=[];OFFER_REDEMPTIONS=[];REFERRALS_ALL=[];REWARDS_ALL=[];

function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

let _trackWatchId=null,_trackOrderKey=null,_lastTrackWrite=0;
function startLiveTracking(orderKey){
  if(_trackWatchId!==null&&_trackOrderKey===orderKey)return;
  stopLiveTracking();
  if(!navigator.geolocation){notifyOnce('gps-unsupported','Location Unavailable','Your device/browser does not support GPS tracking, so customers won\'t see your live location.');return}
  _trackOrderKey=orderKey;
  _trackWatchId=navigator.geolocation.watchPosition(pos=>{
    const now=Date.now();
    if(now-_lastTrackWrite<10000)return; // throttle writes ~every 10s — battery & bandwidth efficient
    _lastTrackWrite=now;
    const{latitude,longitude}=pos.coords;
    db.ref('orders/'+orderKey+'/liveLocation').set({lat:latitude,lng:longitude,updatedAt:now}).catch(()=>{});
    db.ref('orders/'+orderKey+'/trackingPath/'+now).set({lat:latitude,lng:longitude,ts:now}).catch(()=>{});
  },err=>{
    console.warn("GPS watch error:",err);
    notifyOnce('gps-error-'+orderKey,'Location Permission Needed','Please enable location access so customers can see your live delivery location.');
    stopLiveTracking(); // clear state so the next data update retries instead of assuming tracking already succeeded
  },{enableHighAccuracy:true,maximumAge:8000,timeout:20000});
}
function stopLiveTracking(){
  if(_trackWatchId!==null){navigator.geolocation.clearWatch(_trackWatchId);_trackWatchId=null;_trackOrderKey=null}

let _ringCtx=null,_ringInterval=null;
function startRingtone(){
  if(_ringInterval)return;
  try{
    _ringCtx=_ringCtx||new (window.AudioContext||window.webkitAudioContext)();
    const beep=()=>{
      if(!_ringCtx)return;
      const o1=_ringCtx.createOscillator(),g1=_ringCtx.createGain();
      o1.type="sine";o1.frequency.value=880;
      g1.gain.setValueAtTime(0,_ringCtx.currentTime);
      g1.gain.linearRampToValueAtTime(.25,_ringCtx.currentTime+.02);
      g1.gain.linearRampToValueAtTime(0,_ringCtx.currentTime+.35);
      o1.connect(g1);g1.connect(_ringCtx.destination);
      o1.start();o1.stop(_ringCtx.currentTime+.4);
    };
    beep();
    _ringInterval=setInterval(beep,700);
  }catch(e){console.warn("Ringtone unavailable:",e)}
}
function stopRingtone(){
  if(_ringInterval){clearInterval(_ringInterval);_ringInterval=null}
}

/* ===== Reusable Slide-to-Action control (Bug #1 fix: no listener leak) ===== */
let _activeSlide=null;
function _slideMove(clientX){
  if(!_activeSlide||_activeSlide.done)return;
  const{track,handle,fill}=_activeSlide;
  const max=track.offsetWidth-58;
  let x=clientX-_activeSlide.startX;
  x=Math.max(0,Math.min(max,x));
  handle.style.left=(4+x)+"px";
  fill.style.width=(x+58)+"px";
  if(x>=max-2){_activeSlide.done=true;handle.classList.remove("ring-pulse");const cb=_activeSlide.onComplete;_activeSlide=null;cb()}
}
function _slideEnd(){
  if(!_activeSlide)return;
  if(!_activeSlide.done){_activeSlide.handle.style.left="4px";_activeSlide.fill.style.width="0px";_activeSlide.handle.style.cursor="grab"}
  _activeSlide=null;
}
window.addEventListener("mousemove",e=>_slideMove(e.clientX));
window.addEventListener("touchmove",e=>{if(e.touches&&e.touches[0])_slideMove(e.touches[0].clientX)},{passive:true});
window.addEventListener("mouseup",_slideEnd);
window.addEventListener("touchend",_slideEnd);
function initSlideAction(trackId,onComplete){

    _activeSlide={track,handle,fill,onComplete,startX:clientX-(handle.offsetLeft-4),done:false};
    handle.style.cursor="grabbing";
  };
  handle.addEventListener("mousedown",onDown);
  handle.addEventListener("touchstart",onDown,{passive:true});
}

function validateCouponCode(code,cartValue){
  code=(code||'').trim().toUpperCase();
  if(!code)return{valid:false,message:"Please enter a code."};
  const offer=OFFERS.find(o=>o.code&&o.code.toUpperCase()===code&&o.active!==false);
  if(!offer)return{valid:false,message:"Invalid or inactive coupon code."};
  const now=Date.now();
  if(offer.startDate&&now<new Date(offer.startDate).getTime())return{valid:false,message:"This offer hasn't started yet."};
  if(offer.endDate&&now>new Date(offer.endDate).getTime()+86400000-1)return{valid:false,message:"This offer has expired."};
  if(offer.minOrderAmount&&cartValue<offer.minOrderAmount)return{valid:false,message:"Minimum order of "+money(offer.minOrderAmount)+" required for this offer."};
  if(offer.maxRedemptions){
    const totalUsed=OFFER_REDEMPTIONS.filter(r=>r.offerId===offer.id).length;
    if(totalUsed>=offer.maxRedemptions)return{valid:false,message:"This offer has reached its redemption limit."};
  }
  if(offer.perUserLimit&&AUTH_USER){
    const myUsed=OFFER_REDEMPTIONS.filter(r=>r.offerId===offer.id&&r.uid===AUTH_USER.uid).length;
    if(myUsed>=offer.perUserLimit)return{valid:false,message:"You've already used this offer the maximum number of times."};
  }
  return{valid:true,offer};
}

function calcOfferFreeProduct(offer){
  if(!offer||(offer.discountType!=='free_product'&&offer.discountType!=='bogo'))return null;
  return findFreeProductInCart(offer.freeProductId);
}
function calcOfferDiscount(offer,cartValue){
  if(!offer)return 0;
  if(offer.discountType==='fixed'){
    let d=offer.discountValue||0;
    if(offer.maxDiscount)d=Math.min(d,offer.maxDiscount);
    return Math.min(cartValue,d);
  }
  if(offer.discountType==='percentage'){
    let d=Math.round(cartValue*((offer.discountValue||0)/100));
    if(offer.maxDiscount)d=Math.min(d,offer.maxDiscount);
    return Math.min(cartValue,d);
  }
  if(offer.discountType==='free_product'||offer.discountType==='bogo'){
    const fp=calcOfferFreeProduct(offer);
    return fp?fp.price:0;
  }
  return 0; // free_delivery handled separately (zeroes shipping)
}
function calcRewardFreeProduct(reward){
  if(!reward||reward.rewardType!=='free_item')return null;
  return findFreeProductInCart(reward.freeProductId);
}
function calcRewardDiscount(total){
  if(!SELECTED_REWARD_ID)return 0;
  const r=REWARDS_ALL.find(x=>x.id===SELECTED_REWARD_ID);if(!r)return 0;
  if(r.rewardType==='percentage')return Math.min(total,Math.round(total*((r.rewardValue||0)/100)));
  if(r.rewardType==='fixed'||r.rewardType==='coupon')return Math.min(total,r.rewardValue||0);
  if(r.rewardType==='free_item'){const fp=calcRewardFreeProduct(r);return fp?fp.price:0}
  return 0;
}
function nextMilestoneInfo(completed){

      const remaining=completed%m.ordersRequired===0?m.ordersRequired:rem;
      if(!target||remaining<target.remaining)target={milestone:m,remaining};
    }else if(completed<m.ordersRequired){

    }
  });
  return target;
}

function checkAndAwardLoyalty(){
  if(!AUTH_USER||!dataFetched.orders)return;
  const completed=myCompletedOrdersCount();
  const totalSpend=myTotalSpend();
  const mine=myRewards();
  MILESTONES.filter(m=>m.active!==false).forEach(m=>{
    const spendOk=!m.minSpend||totalSpend>=m.minSpend;
    if(m.repeatable){
      const timesEarned=spendOk?Math.floor(completed/m.ordersRequired):0;
      const timesIssued=mine.filter(r=>r.milestoneId===m.id).length;
      if(timesEarned>timesIssued)issueReward(m);
    }else if(completed>=m.ordersRequired&&spendOk&&!mine.some(r=>r.milestoneId===m.id)){
      issueReward(m);
    }
  });
  const now=Date.now();
  mine.forEach(r=>{
    if(r.status==='available'&&r.expiryAt&&now>r.expiryAt){
      rewardsRef.child(r.id).update({status:'expired'});
    }else if(r.status==='available'&&r.expiryAt&&r.expiryAt>now&&(r.expiryAt-now)<3*86400000){
      notifyOnce('expiring-'+r.id,"Reward Expiring Soon",'"'+r.rewardName+'" expires on '+safeDateText(r.expiryAt)+'.');

    const spendOk=!m.minSpend||totalSpend>=m.minSpend;
    let within,remaining,earned;
    if(m.repeatable){
      within=completed%m.ordersRequired||0;
      remaining=m.ordersRequired-within;

function generateReferralCode(name){
  const prefix=(name||"USER").replace(/[^a-zA-Z]/g,"").slice(0,4).toUpperCase().padEnd(4,"X");
  return prefix+Math.random().toString(36).slice(2,6).toUpperCase();
}
function activeReferralCampaign(){return REFERRAL_CAMPAIGNS.find(c=>c.active!==false)||null}
function myReferralCode(){
  if(!PROFILE.referralCode&&AUTH_USER){
    const code=generateReferralCode(PROFILE.name);
    PROFILE.referralCode=code;saveProfile();
    db.ref('users/'+AUTH_USER.uid+'/referralCode').set(code).catch(()=>{});
  }
  return PROFILE.referralCode||"";
}
function myReferralLink(){
  const code=myReferralCode();
  const base=window.location.origin+window.location.pathname;
  return base+(code?"?ref="+encodeURIComponent(code):"");
}
function recordReferral(code,newUid,newName,newEmail){
  if(!code||REFERRAL_SETTINGS.enabled===false)return;
  db.ref('users').orderByChild('referralCode').equalTo(code).once('value').then(snap=>{
    const v=snap.val();if(!v)return; // invalid code — silently ignore
    const referrerUid=Object.keys(v)[0];
    if(referrerUid===newUid)return; // self-referral guard
    referralsRef.orderByChild('referredUid').equalTo(newUid).once('value').then(existSnap=>{
      if(existSnap.val())return; // duplicate guard — this user already has a referral record
      const campaign=activeReferralCampaign();
      const referrerData=v[referrerUid];
      referralsRef.push({
        referrerUid,referrerName:referrerData.name||"",referrerEmail:referrerData.email||"",
        referredUid:newUid,referredName:newName,referredEmail:newEmail,
        code,campaignId:campaign?campaign.id:null,
        status:'pending',createdAt:Date.now(),completedAt:null
      }).catch(e=>console.warn("Referral record failed:",e));
    });
  }).catch(e=>console.warn("Referral lookup failed:",e));
}
function checkReferralProgress(){
  if(!AUTH_USER||!dataFetched.orders||REFERRAL_SETTINGS.enabled===false)return;
  const mine=REFERRALS_ALL.filter(r=>r.referredUid===AUTH_USER.uid&&r.status==='pending');
  mine.forEach(r=>{
    const campaign=REFERRAL_CAMPAIGNS.find(c=>c.id===r.campaignId);
    if(!campaign||!Array.isArray(campaign.tasks)||campaign.tasks.length===0)return;
    const myCompleted=myCompletedOrdersCount();
    const mySpend=ORDERS.filter(o=>o.uid===AUTH_USER.uid&&isOrderCompleted(o)).reduce((s,o)=>s+(o.amount||0),0);
    const allDone=campaign.tasks.every(t=>{
      if(t.type==='orders_count')return myCompleted>=(t.targetValue||0);
      if(t.type==='min_spend')return mySpend>=(t.targetValue||0);
      return true;
    });
    if(!allDone)return;
    referralsRef.child(r.id).update({status:'completed',completedAt:Date.now()}).then(()=>{
      issueReferralReward(r.referrerUid,r.referrerName,r.referrerEmail,campaign.referrerReward,r.id);
      issueReferralReward(r.referredUid,r.referredName,r.referredEmail,campaign.referredReward,r.id);
      referralsRef.child(r.id).update({status:'rewarded'});
      notifyOnce('referral-done-'+r.id,"Referral Reward Unlocked!","You and your friend both earned a reward for completing the referral tasks.");
    }).catch(e=>console.warn("Referral completion failed:",e));
  });
}
function issueReferralReward(uid,name,email,rewardCfg,referralId){
  if(!uid||!rewardCfg||!rewardCfg.type)return;
  const k=rewardsRef.push().key;
  const expiryAt=rewardCfg.expiryDays?Date.now()+rewardCfg.expiryDays*86400000:null;
  const code='REF'+Math.random().toString(36).slice(2,8).toUpperCase();
  const reward={uid,userName:name||"",userEmail:email||"",userMobile:"",milestoneId:null,referralId,rewardName:rewardCfg.name||"Referral Reward",rewardType:rewardCfg.type,rewardValue:rewardCfg.value||0,code,status:'available',issuedAt:Date.now(),expiryAt,usedAt:null,orderId:null};
  rewardsRef.child(k).set(reward).catch(e=>console.warn("Referral reward issue failed:",e));
}

function hideSplash(){

  const route=parseRoute().parts[0]||"home";

function safeRender(){
    // Background data listeners (orders/categories/offers/etc.) fire on ANY realtime change,
    // even ones unrelated to the current user. Blindly calling render() while the user is
    // mid checkout/GPS/order-review wipes that screen's DOM and aborts the in-flight
    // geolocation callback. Data (PRODUCTS/ORDERS/etc.) is already updated above regardless;
    // we just skip the destructive re-render while on these protected routes.
    const route=parseRoute().parts[0]||"home";
    const protectedRoutes=["checkout","pay","cod","confirm"];
    if(protectedRoutes.includes(route)) return;
    render();
}


/* ===== Reliable Refresh + Form Draft Persistence =====
   Realtime Firebase updates can re-render the current view. Drafts are kept
   in sessionStorage so a refresh/re-render restores typed values without
   permanently storing sensitive form data in localStorage.
*/
const ZESTO_DRAFT_PREFIX="zesto_form_draft_v3:";
function zestoDraftRouteKey(){
  return (location.hash||"#/home").split("?")[0] || "#/home";
}
function zestoReadDraft(){
  try{return JSON.parse(sessionStorage.getItem(ZESTO_DRAFT_PREFIX+zestoDraftRouteKey())||"{}")||{}}
  catch(e){return{}}
}
function zestoWriteDraft(d){
  try{sessionStorage.setItem(ZESTO_DRAFT_PREFIX+zestoDraftRouteKey(),JSON.stringify(d))}
  catch(e){}
}
function zestoBindDraftPersistence(){
  const draft=zestoReadDraft();
  const fields=document.querySelectorAll("input,textarea,select");
  fields.forEach(el=>{
    if(el.type==="file")return;
    const key=el.id||el.name;
    if(!key)return;
    if(Object.prototype.hasOwnProperty.call(draft,key)){
      if(el.type==="checkbox"||el.type==="radio") el.checked=!!draft[key];
      else el.value=draft[key];
    }
    const save=()=>{
      const d=zestoReadDraft();
      d[key]=(el.type==="checkbox"||el.type==="radio")?el.checked:el.value;
      zestoWriteDraft(d);
    };
    el.addEventListener("input",save);
    el.addEventListener("change",save);
  });
}
function zestoClearCurrentDraft(){
  try{sessionStorage.removeItem(ZESTO_DRAFT_PREFIX+zestoDraftRouteKey())}catch(e){}
}

let lastRenderRoute="";
function checkAndRender(){
    // Firebase data is asynchronous and must never keep the whole UI on a loader.
    // Render immediately; individual sections can populate when their listeners return.
    hideSplash();
    checkCitySelection();
    const currentRoute=parseRoute().parts[0]||"home";
    // Only render if route changed; don't re-render same screen
    if(currentRoute!==lastRenderRoute){
      lastRenderRoute=currentRoute;
      safeRender();
    }
}

// Catalog/config listeners are bound only after Firebase Auth is ready.
// This prevents an unauthenticated read from temporarily replacing the catalog with [].
let coreCatalogListenersBound=false;
let coreCatalogOwnerUid=null;
let coreCatalogGeneration=0;
function stopCoreCatalogListeners(){
  try{
    productsRef.off('value');
    categoriesRef.off('value');
    offersRef.off('value');
    ratingsRef.off('value');
    appConfigRef.off('value');
  }catch(e){}
  coreCatalogListenersBound=false;
  coreCatalogOwnerUid=null;
  coreCatalogGeneration++;
}
function rebindCoreCatalogListeners(){
  const a=getAuth();
  const uid=a&&a.currentUser?a.currentUser.uid:null;
  if(!uid)return;
  if(coreCatalogListenersBound&&coreCatalogOwnerUid===uid)return;
  stopCoreCatalogListeners();
  coreCatalogOwnerUid=uid;
  const generation=coreCatalogGeneration;
  // Do not clear the current catalog while the new authenticated listeners
  // are attaching. The old code cleared/rebound listeners and immediately
  // rendered Account/Home, creating a brief PRODUCTS=[] state that could
  // persist until a manual refresh.
  productsRef.on('value',snap=>{
    if(generation!==coreCatalogGeneration||!getAuth()?.currentUser||getAuth().currentUser.uid!==uid)return;
    const val=snap.val();
    // Only update PRODUCTS if we have actual data from Firebase.
    // Never clear products based on an empty/incomplete snapshot, which can happen
    // due to permission errors or temporary unavailability.
    if(val&&Object.keys(val).length>0){
      const rows=Object.values(val);
      rows.sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
      PRODUCTS=rows;
      zestoSaveCatalogCache();
    }
    dataFetched.products=true;
    catalogBootComplete=true;
    checkAndRender();
  },err=>{
    if(generation!==coreCatalogGeneration)return;
    console.warn('products read failed:',err&&err.code,err&&err.message);
    dataFetched.products=true;
    catalogBootComplete=true;
    checkAndRender();
  });
  categoriesRef.on('value',snap=>{
    if(generation!==coreCatalogGeneration)return;
    const v=snap.val();
    CATEGORIES=v?Object.keys(v).map(k=>({id:k,...v[k]})):[];
    zestoSaveCatalogCache();
    if(dataFetched.products)safeRender();
  },err=>{
    if(generation!==coreCatalogGeneration)return;
    console.warn('categories read failed:',err&&err.code,err&&err.message);
    CATEGORIES=[];
    if(dataFetched.products)safeRender();
  });
  offersRef.on('value',snap=>{
    if(generation!==coreCatalogGeneration)return;
    const v=snap.val();
    OFFERS=v?Object.keys(v).map(k=>({id:k,...v[k]})).filter(o=>o.active!==false):[];
    zestoSaveCatalogCache();
    if(dataFetched.products)safeRender();
  },err=>{
    if(generation!==coreCatalogGeneration)return;
    console.warn('offers read failed:',err&&err.code,err&&err.message);
    OFFERS=[];
    if(dataFetched.products)safeRender();
  });
  ratingsRef.on('value',snap=>{
    if(generation!==coreCatalogGeneration)return;
    RATINGS=snap.val()?Object.values(snap.val()):[];
    dataFetched.ratings=true;
    checkAndRender();
  },err=>{
    if(generation!==coreCatalogGeneration)return;
    console.warn('ratings read failed:',err&&err.code,err&&err.message);
    RATINGS=[];
    dataFetched.ratings=true;
    checkAndRender();
  });
  appConfigRef.on('value',snap=>{
    if(generation!==coreCatalogGeneration)return;
    CONFIG=snap.val()||{};
    HERO_IMAGE_URL=CONFIG.heroImage||"";
    BANNER_TEXT=CONFIG.bannerText||"";
    APP_LOGO_URL=CONFIG.appLogo||"";
    if(CONFIG.allowedCities) ALLOWED_CITIES=CONFIG.allowedCities.split(',').map(s=>s.trim());
    if(BANNER_TEXT){$("#animated-banner-text").textContent=BANNER_TEXT;$("#animated-banner-wrap").style.display="block"}
    else{$("#animated-banner-wrap").style.display="none"}
    if(APP_LOGO_URL){$("#app-logo").src=APP_LOGO_URL;$("#app-logo").style.display="block"}
    else{$("#app-logo").style.display="none"}
    dataFetched.config=true;
    zestoSaveCatalogCache();
    checkAndRender();
  },err=>{
    if(generation!==coreCatalogGeneration)return;
    console.warn('config read failed:',err&&err.code,err&&err.message);
    dataFetched.config=true;
    checkAndRender();
  });
  coreCatalogListenersBound=true;
}let MILESTONES=[],REWARDS_ALL=[];

    if(!target||!PROTECTED_NAV.includes(target))return;
    // Firebase Auth is the source of truth — check its live currentUser here
    // (not just the cached AUTH_USER var) before letting the menu open a
    // protected page, so an inconsistent/unresolved auth state can't open Shop.
    const fa=getAuth();
    if(fa&&!fa.currentUser){
      console.log("[auth] drawer nav to '"+target+"' blocked — no Firebase currentUser.");
      e.preventDefault();
      routeTo("#/login");
    }
  }));
  $("#drawer-logout")?.addEventListener("click",e=>{
    e.preventDefault();
    console.log("[auth] Logout clicked. currentUser before signOut:",getAuth()?.currentUser?getAuth().currentUser.uid:null);
    const a=getAuth();
    if(!a)return;
    a.signOut().then(()=>{
      // Firebase Auth is the source of truth, but we clear every local cache
      // derived from the previous session so no stale "logged in" state lingers.
      AUTH_USER=null;
      PROFILE={name:"",email:"",phone:"",address:"",pincode:"",city:"",state:"",district:"",landmark:"",avatar:"",isComplete:false,favorites:[]};

      console.log("[auth] Logout complete. AUTH_USER cleared, PROFILE cache cleared, CART cleared. currentUser now:",a.currentUser?a.currentUser.uid:null);
      toast("Logged out");routeTo("#/home");
      render();
    });
  });
}

const GROCERY_KEYWORDS=['FRESH','VEGETABLE','FRUIT'];
function catsForMode(mode){
  const map={};
  PRODUCTS.forEach(p=>{
    if(!p.category)return;
    const isGrocery=GROCERY_KEYWORDS.some(k=>p.category.toUpperCase().includes(k));
    const belongs=(mode==='grocery')?isGrocery:!isGrocery;
    if(!belongs)return;
    if(!map[p.category])map[p.category]={name:p.category,imageUrl:(p.imageUrls&&p.imageUrls[0])||''};
  });
  CATEGORIES.filter(c=>c.type===mode).forEach(c=>{
    map[c.name]={name:c.name,imageUrl:c.imageUrl||(map[c.name]?map[c.name].imageUrl:'')};
  });
  return Object.values(map);
}

function attachProductCardHandlers(scope){

  scope.querySelectorAll(".like-btn").forEach(btn=>{

    btn.addEventListener("click",e=>{e.preventDefault();e.stopPropagation();addToCart(btn.dataset.add,"NA",1);toast("Added to cart")});

  $("#lg-submit").addEventListener("click",()=>{

    const id=$("#lg-id").value.trim();const pw=$("#lg-pw").value;

    const btn=$("#lg-submit");btn.disabled=true;btn.innerHTML="Logging in...";
    const doLogin=email=>getAuth().signInWithEmailAndPassword(email,pw).then(cred=>{
      return db.ref('users/'+cred.user.uid).once('value').then(snap=>{
        const u=snap.val();
        if(u&&u.blocked){
          getAuth().signOut();
          errBox.textContent="Your account has been blocked by the admin. Please contact support.";
          errBox.style.display="block";btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> Login';

      }else{
        errBox.textContent=e.message.replace("Firebase: ","");
      }
      errBox.style.display="block";btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> Login';
    });
    if(id.includes("@")){doLogin(id)}
    else{
      db.ref('users').orderByChild('mobile').equalTo(id).once('value').then(snap=>{
        const v=snap.val();
        if(!v){errBox.textContent="No account found with this mobile number. Use your registered email.";errBox.style.display="block";btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> Login';return}
        const rec=Object.values(v)[0];doLogin(rec.email);
      }).catch(e=>{
        console.warn("[auth] mobile login lookup failed:",e&&e.code,e&&e.message);
        errBox.textContent="Mobile login is unavailable with the current secure Firebase rules. Please use your registered email.";
        errBox.style.display="block";btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> Login';
      });
    }
  });
}

function submitRating(productId,rating,userEmail,userName,reviewText){
  const existing=RATINGS.find(r=>r.productId===productId&&r.userEmail===userEmail);
  const data={productId,userEmail,userName:userName||'',rating,reviewText:reviewText||'',createdAt:Date.now()};
  if(existing){db.ref('ratings/'+existing.firebaseKey).update(data).then(()=>toast("Review updated!")).catch(()=>alert("Failed."))}
  else{const k=db.ref('ratings').push().key;db.ref('ratings/'+k).set({...data,firebaseKey:k}).then(()=>toast("Review submitted!")).catch(()=>alert("Failed."))}
}

/* ===== Minimum Order Requirements (admin-configurable, no hardcoding) ===== */
function checkMinOrderRequirements(){
  const minProducts=Number(CONFIG.minProducts)||0;
  const minOrderValue=Number(CONFIG.minOrderValue)||0;
  const productCount=CART.reduce((s,c)=>s+c.qty,0);
  const cartValue=cartTotal();
  if(productCount>=minProducts&&cartValue>=minOrderValue)return true;
  showMinOrderPopup(minProducts,minOrderValue,productCount,cartValue);
  return false;
}

/* Swipe-down-to-dismiss for the cart sheet — registered once, no per-render listener leak */
(function initCartSheetSwipe(){
  const sheet=document.getElementById("cart-sheet");
  const handle=sheet?.querySelector(".cart-sheet-handle");
  if(!handle)return;
  let startY=0,dragging=false;
  const onStart=e=>{dragging=true;startY=(e.touches?e.touches[0].clientY:e.clientY);sheet.style.transition="none"};
  const onMove=e=>{
    if(!dragging)return;
    const y=(e.touches?e.touches[0].clientY:e.clientY);
    const dy=Math.max(0,y-startY);
    sheet.style.transform=`translateY(${dy}px)`;
  };
  const onEnd=e=>{
    if(!dragging)return;
    dragging=false;
    sheet.style.transition="";
    const y=(e.changedTouches?e.changedTouches[0].clientY:e.clientY);
    const dy=Math.max(0,y-startY);
    sheet.style.transform="";
    if(dy>80)closeCartSheet();
  };
  handle.addEventListener("mousedown",onStart);
  handle.addEventListener("touchstart",onStart,{passive:true});
  window.addEventListener("mousemove",onMove);
  window.addEventListener("touchmove",onMove,{passive:true});
  window.addEventListener("mouseup",onEnd);
  window.addEventListener("touchend",onEnd);
})();
function closeCartSheet(){
  $("#cart-sheet").classList.remove("open");
  $("#cart-sheet-backdrop").classList.remove("open");
  if(location.hash.startsWith("#/cart")){
    routeTo("#/home"); // deterministic — never depend on the browser history stack, which can be empty/stale and strand the hash on #/cart, causing the sheet to silently reopen on the next background re-render
  }
}

function addToCart(pid,size,qty){const idx=CART.findIndex(x=>x.productId===pid);if(idx>-1)CART[idx].qty+=qty;else CART.push({productId:pid,size,qty});saveCart()}

function removeFromCart(pid){CART=CART.filter(x=>x.productId!==pid);saveCart();render()}

    PROFILE.isComplete=hasCompleteProfile();if(!PROFILE.isComplete){alert("Please fill name, email, phone, address and pincode.");return}
    
    // Verify location one more time before submission
    const lat=latEl.value;const lng=lngEl.value;
    if(!lat || !lng) { alert("Location is missing. Please refresh and allow GPS."); return; }
    if(!USER_LIVE_LOCATION || USER_LIVE_LOCATION.lat===undefined) { alert("Location permission issue. Please turn on GPS again."); return; }
    
    saveProfile();

    const basePayout = CONFIG.payout_0_2 || 20;

    const items=CART.map(it=>{
        const p=PRODUCTS.find(x=>x.id===it.productId);
        return {productId:it.productId,name:p?.name,price:getPrice(p),mrp:getMrp(p),shipping:getShipping(p),qty:it.qty,size:"NA"}
    });
    const amount=cartTotal();const orderId="ZST-"+Date.now().toString().slice(-8);
    const appliedReward=SELECTED_REWARD_ID?REWARDS_ALL.find(r=>r.id===SELECTED_REWARD_ID):null;

    // Vendor assignment is Admin-controlled; a new order is invisible to vendors until assigned.
     const orderVendorUid=null;
     const orderBase={
        orderId,items,customer:{...PROFILE,lat:Number(lat),lng:Number(lng)},amount:finalAmount,
        uid:AUTH_USER?AUTH_USER.uid:null,
        vendorUid:orderVendorUid,
        originalAmount:amount,discountAmount:totalDiscount,platformCost,
        freeProductGiven: freeProductGiven?{productId:freeProductGiven.productId,name:freeProductGiven.name,price:freeProductGiven.price}:null,
        rewardApplied: appliedReward?{rewardId:appliedReward.id,code:appliedReward.code,rewardName:appliedReward.rewardName,rewardType:appliedReward.rewardType,rewardValue:appliedReward.rewardValue,discount:rewardDiscount}:null,

function finalizeCOD(){
  const pend=readLocal("sf_pending",null);if(!pend){alert("No pending order.");return}
  const a=getAuth();
  if(!a||!a.currentUser){alert("Please login again before placing the order.");routeTo("#/login");return}
  try{
    // Validate all required fields before Firebase write
    if(!pend.items||!Array.isArray(pend.items)||pend.items.length===0){
      console.error("Order validation failed: missing or invalid items array");
      alert("Failed to place order: Invalid cart items.");
      return;
    }
    if(!pend.customer||typeof pend.customer!=='object'){
      console.error("Order validation failed: missing customer object");
      alert("Failed to place order: Missing customer information.");
      return;
    }
    if(!pend.deliveryLocation||typeof pend.deliveryLocation!=='object'||pend.deliveryLocation.lat===undefined||pend.deliveryLocation.lng===undefined){
      console.error("Order validation failed: missing or invalid deliveryLocation");
      alert("Failed to place order: Missing delivery location.");
      return;
    }
    if(!pend.orderId){
      console.error("Order validation failed: missing orderId");
      alert("Failed to place order: Order ID generation failed.");
      return;
    }
    
    const k=db.ref('orders').push().key;
    const isOnline=pend.paymentMethod==="online";
    const raw={...pend,uid:a.currentUser.uid,customer:pend.customer||PROFILE,firebaseKey:k,createdAt:Date.now(),status:isOnline?"Online Payment - Verifying":"COD - Placed",trackingUrl:"",deliveryBoy:null,deliveryBoyUid:null,deliveryBoyEmail:null,deliveryStatus:"New Order"};
    const data=JSON.parse(JSON.stringify(raw)); // strips undefined fields (e.g. deleted product) that make Firebase .set() throw synchronously
    db.ref('orders/'+k).set(data).then(()=>{
      try{
        writeLocal("sf_last_order",data);
        localStorage.removeItem("sf_pending");
        CART=[];
        saveCart();
        closeCartSheet();
        
        // Mark reward as used if applied
        if(pend.rewardApplied?.rewardId){
          db.ref('rewards/'+pend.rewardApplied.rewardId).update({status:'used',usedAt:Date.now(),orderId:pend.orderId}).catch(e=>{
            console.error("Reward mark-used failed:",e);
          });
        }
        
        // Record offer redemption if applied
        if(pend.offerApplied?.offerId){
          if(typeof offerRedemptionsRef==='object'&&offerRedemptionsRef!==null){
            offerRedemptionsRef.push({offerId:pend.offerApplied.offerId,code:pend.offerApplied.code,uid:AUTH_USER?AUTH_USER.uid:null,userEmail:PROFILE.email,orderId:pend.orderId,redeemedAt:Date.now()}).catch(e=>{
              console.error("Offer redemption record failed:",e);
            });
          }else{
            console.warn("offerRedemptionsRef not available for offer redemption recording");
          }
        }
        
        routeTo("#/cod/success");
      }catch(err){
        console.error("Order success flow failed:",err);
        alert("Failed to place order: "+(err.message||"Please try again."));
      }
    }).catch(err=>{
      console.error("Order sync failed:",err);
      console.error("Order sync error details:",{message:err.message,code:err.code,stack:err.stack});
      alert("Failed to place order: "+(err.message||"Please try again."));
    });
  }catch(err){
    console.error("Order build failed:",err);
    console.error("Order build error details:",{message:err.message,code:err.code,stack:err.stack});
    alert("Failed to place order: "+(err.message||"Please try again."));
  }
}

function ConfirmView(){
  setTopbar("Live Order Tracking",true);setActiveTab("");
  
  // Refresh live order data from DB if available
  const lastLocal = readLocal("sf_last_order",null);
  let orderData = lastLocal;

  if (lastLocal && lastLocal.orderId) {

      if (liveData) orderData = liveData;
  }

  // BUG FIX: Stop execution if orderData is missing, otherwise it crashes the page and loader hangs

  }

  const items=orderData.items||[];
  const grand=items.reduce((a,it)=>a+((it.price||0)*it.qty+(typeof it.shipping === 'number' ? it.shipping : 50)),0);
  
  const isDelivered = orderData.deliveryStatus === 'Delivered' || orderData.status === 'Delivered';
  const isCancelled = orderData.status && orderData.status.includes('Cancelled');
  let timerHtml = '';
  
  // Order Timer Logic - specifically placed in Confirmation/Tracking Page
  if (!isDelivered && !isCancelled && orderData) {
      timerHtml = `<div class="card pad" style="margin-bottom:12px; text-align:center; background:#FFF8E1; border-color:#FFE082;">
          <h4 style="margin:0; color:#F57C00; font-family:Poppins;"><i class="fa-solid fa-stopwatch"></i> Estimated Delivery</h4>

          <div style="font-size:12px; color:#F57C00; margin-top:4px;">We are preparing your food!</div>
      </div>`;
      
      setTimeout(() => {
          const timerEl = document.getElementById(`order-timer`);
          if(!timerEl) return;
          
          let intv;
          const updateTimer = () => {
              if(!document.getElementById(`order-timer`)) return clearInterval(intv);
              // Re-fetch live order data to get the latest prepTimeMinutes (vendor may have updated it)
              const liveOrder = ORDERS.find(o => o.orderId === orderData.orderId) || orderData;
              const currentTimer = liveOrder.prepTimeMinutes || liveOrder.deliveryTimer || 30;
              const targetTime = liveOrder.createdAt + currentTimer * 60 * 1000;
              const now = Date.now();
              const diff = targetTime - now;
              if(diff <= 0) {
                  timerEl.textContent = "Almost there!";
                  clearInterval(intv);
              } else {
                  const m = Math.floor(diff / 60000);
                  const s = Math.floor((diff % 60000) / 1000);
                  timerEl.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')} Min`;
              }
          };
          updateTimer();
          intv = setInterval(updateTimer, 1000);
      }, 100);
  }

  $("#view").innerHTML=`<section style="padding:14px">
    ${timerHtml}
    <div class="card pad" style="text-align:center"><div class="check-anim"><i class="fa-solid fa-check" style="font-size:36px"></i></div><h2 style="margin:6px 0;font-family:Poppins;color:var(--accentDark)">Thank you!</h2><div class="muted">Order <b>#${escapeHtml(orderData.orderId||"")}</b></div><div class="chip" style="margin-top:8px;background:var(--accentLight);color:var(--accentDark)">${escapeHtml(orderData.status||'Placed')}</div></div>

function fallbackCopyText(text){
  try{
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.left="-9999px";ta.style.top="0";
    document.body.appendChild(ta);ta.focus();ta.select();
    const ok=document.execCommand("copy");
    document.body.removeChild(ta);
    toast(ok?"Code copied!":"Couldn't copy — code is "+text);
  }catch(e){toast("Couldn't copy — code is "+text)}
}

function OrderDetailView(orderId){
  const o=ORDERS.find(x=>x.orderId===orderId);if(!o){OrdersListView();return}
  window.__zestoDeliveryReviewKey=o.firebaseKey;
  setTopbar("Order Detail",true);setActiveTab("");
  
  const sub=o.items.reduce((a,it)=>a+((it.price||0)*it.qty),0);
  const shipT=o.items.reduce((a,it)=>a+(typeof it.shipping === 'number' ? it.shipping : 50),0);

  const delHtml=o.deliveryBoy?`<div class="card pad" style="margin-top:12px"><h4 style="margin:0 0 8px;font-family:Poppins;color:var(--accentDark)"><i class="fa-solid fa-motorcycle"></i> Delivery Partner</h4><div>${escapeHtml(o.deliveryBoy.name||'—')}</div><div class="muted">${escapeHtml(o.deliveryBoy.phone||'')}</div><span class="del-status-chip ${delStatusClass(o.deliveryStatus||'Picked Up')}" style="margin-top:6px;display:inline-flex">${escapeHtml(o.deliveryStatus||'Assigned')}</span></div>`:'';

  const isDelivered = o.deliveryStatus === 'Delivered' || o.status === 'Delivered';
  const isCancelled = o.status && o.status.includes('Cancelled');
  let timerHtml = '';

  if (!isDelivered && !isCancelled && o) {
      timerHtml = `<div class="card pad" style="margin-bottom:12px; text-align:center; background:#FFF8E1; border-color:#FFE082;">
          <h4 style="margin:0; color:#F57C00; font-family:Poppins;"><i class="fa-solid fa-stopwatch"></i> Estimated Delivery</h4>
          <div id="order-detail-timer-${o.orderId}" style="font-size:32px; font-weight:bold; color:#E65100; margin-top:8px;">--:--</div>
          <div style="font-size:12px; color:#F57C00; margin-top:4px;">We are preparing your food!</div>
      </div>`;

      setTimeout(() => {
          const timerEl = document.getElementById(`order-detail-timer-${o.orderId}`);
          if(!timerEl) return;
          
          let intv;
          const updateTimer = () => {
              if(!document.getElementById(`order-detail-timer-${o.orderId}`)) return clearInterval(intv);
              // Re-fetch live order data to get the latest prepTimeMinutes (vendor may have updated it)
              const liveOrder = ORDERS.find(x => x.orderId === o.orderId) || o;
              const currentTimer = liveOrder.prepTimeMinutes || liveOrder.deliveryTimer || 30;
              const targetTime = liveOrder.createdAt + currentTimer * 60 * 1000;
              const now = Date.now();
              const diff = targetTime - now;
              if(diff <= 0) {
                  timerEl.textContent = "Almost there!";
                  clearInterval(intv);
              } else {
                  const m = Math.floor(diff / 60000);
                  const s = Math.floor((diff % 60000) / 1000);
                  timerEl.textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')} Min`;
              }
          };
          updateTimer();
          intv = setInterval(updateTimer, 1000);
      }, 100);
  }

  const isActiveTracking = !!(o.deliveryBoy&&o.deliveryLocation&&safeDateValue(o.liveLocation?.updatedAt||o.liveLocation?.timestamp)&&Date.now()-Number(o.liveLocation.updatedAt||o.liveLocation.timestamp)<120000&&(o.deliveryStatus==='Picked Up'||o.deliveryStatus==='On the Way'||o.deliveryStatus==='Near Customer'||o.deliveryStatus==='Going to Restaurant'||o.deliveryStatus==='Arrived at Restaurant'));
  let trackingHtml='';
  if(isActiveTracking){
    const distKm=haversineKm(o.liveLocation.lat,o.liveLocation.lng,o.deliveryLocation.lat,o.deliveryLocation.lng);
    const etaMin=estimateEtaMinutes(distKm);
    const agoSec=o.liveLocation.updatedAt?Math.max(0,Math.round((Date.now()-o.liveLocation.updatedAt)/1000)):0;
    trackingHtml=`<div class="card pad" style="margin-bottom:12px;padding:0;overflow:hidden">
      <div id="live-track-map" style="width:100%;height:220px"></div>
      <div style="padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><div style="font-weight:800;font-family:Poppins;color:var(--accentDark);font-size:20px">${etaMin} min</div><div class="muted" style="font-size:12px">Estimated arrival</div></div>
          <div style="text-align:right"><div style="font-weight:800;color:var(--accentDark)">${distKm.toFixed(1)} km</div><div class="muted" style="font-size:12px">Remaining</div></div>
        </div>
        <div class="muted" style="font-size:12px;margin-top:8px"><i class="fa-solid fa-circle-dot" style="color:var(--success)"></i> Live tracking — updated ${agoSec}s ago</div>
      </div>
    </div>`;
  }

  const currentStage=isCancelled?-1:stageIndex(o.deliveryStatus||'New Order');
  const timelineHtml = isCancelled?'':`<div class="card pad" style="margin-bottom:12px">
    <h4 style="margin:0 0 14px;font-family:Poppins;color:var(--accentDark)"><i class="fa-solid fa-truck-fast"></i> Order Status</h4>
    <div style="display:flex;flex-direction:column;gap:0">
      ${ORDER_STAGES.map((stage,i)=>`
        <div style="display:flex;gap:12px">
          <div style="display:flex;flex-direction:column;align-items:center">
            <div style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex-shrink:0;${i<=currentStage?'background:var(--accent);color:#fff':'background:#eee;color:#999'}">${i<currentStage?'<i class="fa-solid fa-check"></i>':i+1}</div>
            ${i<ORDER_STAGES.length-1?`<div style="width:2px;flex:1;min-height:22px;background:${i<currentStage?'var(--accent)':'#eee'}"></div>`:''}
          </div>
          <div style="padding-bottom:18px;padding-top:2px;font-weight:${i===currentStage?'700':'500'};color:${i<=currentStage?'var(--accentDark)':'#999'}">${stage}${i===currentStage?' <span class="muted" style="font-weight:400;font-size:12px">(current)</span>':''}</div>
        </div>`).join('')}
    </div>
  </div>`;

  $("#view").innerHTML=`<section style="padding:14px">
    ${timerHtml}
    ${trackingHtml}
    ${timelineHtml}
    <div class="card pad">
    <div class="row"><div><strong style="color:var(--accentDark)">Order</strong> #${escapeHtml(o.orderId)}</div><div class="muted">${safeDateText(o.createdAt,"datetime")}</div></div><div class="sep"></div>
    ${o.items.map(it=>`<div class="order-line"><div class="oi-name">${escapeHtml(it.name)} <span class="muted">x${it.qty}</span></div><div class="oi-price" style="color:var(--accentDark)">${money((it.price||0)*it.qty+(typeof it.shipping === 'number' ? it.shipping : 50))}</div></div>`).join("")}
    <div class="sep"></div>
    <div class="row"><strong>Total</strong><strong style="color:var(--accentDark)">${money(o.amount)}</strong></div>
    <div class="chip" style="margin-top:8px;background:var(--accentLight);color:var(--accentDark)">${escapeHtml(o.status)}</div>
  </div>${delHtml}${deliveryReviewHtml(o)}<div style="margin-top:12px"><a class="btn btn-outline" href="#/account/orders"><i class="fa-solid fa-arrow-left"></i> Back</a></div></section>`;

  if(isActiveTracking){
    setTimeout(()=>{
      const mapEl=document.getElementById('live-track-map');
      if(!mapEl)return;
      if(mapEl._leaflet_id)mapEl._leaflet_id=null;
      try{
        const map=L.map('live-track-map',{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false}).setView([o.liveLocation.lat,o.liveLocation.lng],14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CartoDB'}).addTo(map);
        const partnerIcon=L.divIcon({html:'<div style="background:var(--accent);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:15px"><i class="fa-solid fa-motorcycle"></i></div>',className:'',iconSize:[34,34]});
        const homeIcon=L.divIcon({html:'<div style="background:#E11D48;color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:13px"><i class="fa-solid fa-house"></i></div>',className:'',iconSize:[30,30]});
        L.marker([o.liveLocation.lat,o.liveLocation.lng],{icon:partnerIcon}).addTo(map);
        L.marker([o.deliveryLocation.lat,o.deliveryLocation.lng],{icon:homeIcon}).addTo(map);
        L.polyline([[o.liveLocation.lat,o.liveLocation.lng],[o.deliveryLocation.lat,o.deliveryLocation.lng]],{color:'#145A32',weight:3,dashArray:'6,6'}).addTo(map);
        map.fitBounds([[o.liveLocation.lat,o.liveLocation.lng],[o.deliveryLocation.lat,o.deliveryLocation.lng]],{padding:[30,30]});
        setTimeout(()=>map.invalidateSize(),200);
      }catch(err){console.warn("Live tracking map init failed:",err)}
    },100);
  }

async function compressToDataURL(file,maxW=1200,maxH=1200,quality=.85){const img=await fileToImage(file);const[w,h]=fitRect(img.naturalWidth,img.naturalHeight,maxW,maxH);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);return c.toDataURL("image/jpeg",quality)}
function fitRect(w,h,mW,mH){const r=Math.min(mW/w,mH/h,1);return[Math.round(w*r),Math.round(h*r)]}
function fileToImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function playSuccessSound(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type="triangle";o.frequency.setValueAtTime(660,ctx.currentTime);g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.3,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.42);setTimeout(()=>ctx.close(),600)}catch(e){}}

let liveLocationIntervalId=null;
let currentTrackingOrderKey=null;

function startLiveLocationTracking(orderKey){
  currentTrackingOrderKey=orderKey;
  if(liveLocationIntervalId)clearInterval(liveLocationIntervalId);
  
  function updateLocation(){
    if(!USER_LIVE_LOCATION)return;
    const locData={lat:USER_LIVE_LOCATION.lat,lng:USER_LIVE_LOCATION.lng,timestamp:Date.now()};
    db.ref('orders/'+orderKey+'/liveLocation').set(locData).catch(err=>console.warn("Live location update failed:",err));
  }
  
  updateLocation();
  liveLocationIntervalId=setInterval(updateLocation,3000);
}

function stopLiveLocationTracking(){
  if(liveLocationIntervalId){clearInterval(liveLocationIntervalId);liveLocationIntervalId=null}
  currentTrackingOrderKey=null;
}

function calculateDistance(lat1,lng1,lat2,lng2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return(R*c).toFixed(1);
}

function calculateETA(distance,avgSpeed=40){
  const hours=distance/avgSpeed;
  const minutes=Math.round(hours*60);
  if(minutes<1)return"< 1 min";
  if(minutes<60)return minutes+" min";
  const h=Math.floor(minutes/60);
  const m=minutes%60;
  return h+"h "+m+"m";
}

function render(){
  const{parts}=parseRoute();
  // Never block the entire application on a secondary Firebase listener.
  // Products/config may be temporarily unavailable; the app must still render.
  hideSplash();
  initAuthListenerOnce();
  const[r,id,sub]=parts;
  const authScreens=["login","signup","forgot-password"];
  // Firebase Auth is the single source of truth for login state. Its initial
  // check is asynchronous, so AUTH_USER is only trustworthy once authBootHandled
  // is true (set inside onAuthStateChanged's first callback). Redirecting to
  // login before that point would incorrectly bounce an already-logged-in user
  // (persisted session not yet confirmed) — this was the source of the unstable
  // login state / "flicker" bug. Once authBootHandled flips true, onAuthStateChanged
  // already triggers a fresh render(), so this guard re-evaluates correctly.
  if(getAuth()&&authBootHandled&&!AUTH_USER&&!authScreens.includes(r)){
    console.log("[auth] blocking protected route '"+r+"' — no AUTH_USER, redirecting to login");
    routeTo("#/login");return;
  }
  const catalogScreens=["home","shop","product","offers","offer","cart"];
  updateTabbar();
  renderCartBar();
  stopRingtone();
  if(!r||r==="home")HomeView();
  else if(r==="shop")ShopView(id?decodeURIComponent(id):null);
  else if(r==="product"&&id)ProductView(id);
  else if(r==="cart")CartView();
  else if(r==="offers")OffersView();
  else if(r==="offer"&&id)OfferDetailView(id);
  else if(r==="login")LoginView();
  else if(r==="signup")SignupView();
  else if(r==="forgot-password")ForgotPasswordView();
  else if(r==="checkout")CheckoutView();
  else if(r==="pay"&&id==="online")OnlinePayView();
  else if(r==="cod"&&id==="review")CODReviewView();
  else if(r==="cod"&&id==="success")CODSuccessView();
  else if(r==="confirm")ConfirmView();
  else if(r==="account"&&id==="orders"&&sub)OrderDetailView(sub);
  else if(r==="account"&&id==="orders")OrdersListView();
  else if(r==="favorites")FavoritesView();
  else if(r==="rewards")MyRewardsView();
  else if(r==="invite")InviteEarnView();
  else if(r==="account")AccountView();
  else if(r==="profile"&&id==="setup")ProfileEditView(true);
  else if(r==="profile")ProfileEditView(false);
  else if(r==="contact-support")ContactSupportView();
  else HomeView();
  setTimeout(zestoBindDraftPersistence,0);
}

  // keeps the exact current route (Account, Orders, Profile, etc.).

  if(!location.hash){
    location.hash="#/home";
  }

  // Render immediately. The splash is only visual; Firebase data fills sections as it arrives.
  checkCitySelection();

    location.hash="#/home";
  }
  checkAndRender();
})();
